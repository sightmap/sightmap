version: 1

memory:
  - Statically prerendered React app — every route serves complete HTML, so a
    snapshot right after navigation is already final. No loading states to wait on.
  - Every section carries a build-emitted `data-component` attribute whose value
    is suffixed per build (`Hero-a1b2c3`), so always match with `^=`, never `=`.
  - The site has no application API. The only non-asset traffic is the Fullstory
    analytics snippet; nothing on the page fetches data at runtime.
  - Requesting a route without its trailing slash (`/blog`) serves a redirect to
    the canonical trailing-slash form (`/blog/`), so `location.pathname` never
    matches the href you clicked.

components:
  - name: Navigation
    selector: '[data-component^="Navigation"]'
    memory:
      - The Spec, Memory, and Get started links are in-page anchors (`/#spec`,
        `/#memory`, `/#start`) — clicking them scrolls the home page and never
        navigates. Only Blog, Docs, and GitHub leave the current view.
      - Docs and GitHub point off-site (docs.sightmap.org, github.com); an agent
        following them leaves the mapped surface.
    children:
      - name: NavHomeLink
        selector: 'a[href="/"]'
      - name: NavBlogLink
        selector: 'a[href="/blog"]'

  - name: Footer
    selector: '[data-component^="Footer"]'
    memory:
      - Holds the only button on the site — "Privacy preferences" — which opens
        the consent UI for the Fullstory analytics snippet.
    children:
      - name: PrivacyPreferencesButton
        selector: button

requests:
  - name: FullstorySettings
    route: /s/settings/*/v1/web
    method: GET
    description: Fullstory per-org recording settings, fetched by the analytics snippet on every page load.
    headers:
      - origin

  - name: FullstoryPageBeacon
    route: /rec/page
    method: POST
    description: Fullstory session-recording page beacon. Fires on every page load once consent allows it.
    headers:
      - content-type
