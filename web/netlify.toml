[build]
  command = "pnpm build"
  publish = "dist"

# Pretty API URLs. Static files at these paths win over a non-forced rewrite,
# so /api/atlas.json and /api/atlas/<slug>.json (written by
# scripts/generate-agent-files.ts) are the source of truth. Unknown slugs
# fall through to the 404 catch-all; the negotiate edge function turns that
# HTML 404 into a JSON error for /api/*.
[[redirects]]
  from = "/api/atlas"
  to = "/api/atlas.json"
  status = 200

[[redirects]]
  from = "/api/atlas/:slug"
  to = "/api/atlas/:slug.json"
  status = 200

# Unknown URLs. Every real route has a prerendered dist/<route>/index.html, and
# Netlify serves an existing static file before applying a non-forced redirect,
# so this rule only ever answers paths that do not exist. It used to return 200
# with the homepage shell — and that shell's canonical points at the homepage,
# so every broken inbound link became a 200-status duplicate of the homepage.
# scripts/check-route-coverage.ts fails the build if a route is added without a
# prerendered page, which is what keeps this safe.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Vite writes a content hash into every filename under /assets/, so a changed
# file is always a new URL and the old one is safe to keep forever. Without
# this the Netlify default applies (`max-age=0, must-revalidate`), and every
# page view revalidates the bundle: a 304 saves the bytes but still costs a
# round trip per asset. This site is prerendered, so every internal link is a
# full page load rather than a client-side route change — that round trip is
# paid on each one.
#
# Scoped to /assets/ deliberately. Nothing else in dist/ is content-hashed:
# /atlas/ alone is ~4.7MB of generated screenshots and archives written to
# stable paths, and marking those immutable would pin a removed entry — a
# takedown — in caches for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Vary = "Accept, Accept-Encoding"

[[headers]]
  for = "/blog/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Vary = "Accept, Accept-Encoding"

[[headers]]
  for = "/atlas/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Vary = "Accept, Accept-Encoding"

[[headers]]
  for = "/openapi.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Vary = "Accept, Accept-Encoding"

# Inject the visitor's consent region into app HTML (replaces <!--CC_REGION-->).
# The function guards on content-type, so non-HTML responses pass through;
# assets are excluded outright to avoid pointless invocations.
[[edge_functions]]
  function = "geo-region"
  path = "/*"
  excludedPath = ["/assets/*"]

# Accept negotiation (markdown / JSON errors / Vary: Accept). Declared after
# geo-region so geo-region is outermost: it calls next(), this function
# rewrites, and geo-region only injects into remaining HTML.
[[edge_functions]]
  function = "negotiate"
  path = "/*"
  excludedPath = ["/assets/*"]
