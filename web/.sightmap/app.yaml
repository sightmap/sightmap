version: 1

memory:
  - sightmap.org is the landing site for the open-source sightmap spec, plus a blog at /blog
  - All homepage sections live in src/components/ and compose into src/pages/Home.tsx
  - Posts are markdown in content/blog/; scripts/build-blog.ts generates the manifest and per-post HTML modules
  - Pages are statically prerendered by scripts/prerender.tsx; the client hydrates rather than mounting fresh
  - "The negotiate edge function (netlify/edge-functions/negotiate.ts) serves markdown twins for Accept: text/markdown and JSON errors for /api/* and for 404s that asked for JSON; it always sets Vary: Accept"
  - "The offline matcher has no pseudo-class support: a selector like `.foo:first-child` probes 1 live and 0 offline, so keep selectors to attributes, classes and descendant combinators"

views:
  - name: HomePage
    route: /
    description: Main landing page for the Sightmap spec
    source: src/pages/Home.tsx
    components:
      - name: Hero
        selector: '[data-component="Hero"]'
        source: src/components/Hero.tsx
        description: Headline, sitemap/.sightmap contrast, CTAs, and a before/after date-picker snapshot diff
        memory:
          - Contains the `teaches` accent treatment (bordered underline on the word itself)
          - The before/after diff lives in a wider 1180px wrap outside the 860px container
        children:
          - name: hero-badge
            selector: ".hero-badge"
          - name: hero-sub
            selector: ".hero-sub"
          - name: hero-teaches
            selector: ".hero-teaches"
          - name: hero-ctas
            selector: ".hero-ctas"
          - name: hero-robust
            selector: ".hero-robust"
          - name: hero-diff
            selector: ".hero-diff"

      - name: BuildingBillboard
        selector: '[data-component="BuildingBillboard"]'
        source: src/components/BuildingBillboard.tsx
        dependencies:
          - src/components/building/BillboardScene.tsx
        description: Billboard for the /building tour — headline, subcopy, CTA, and a live slice of the 3D building that orbits slowly through a day/night cycle
        memory:
          - Rendered inside the Hero section, between the hero copy and the date-picker diff, so it sits inside `[data-component="Hero"]` in the DOM
          - A full-bleed dark band (always dark, unlike /building which only darkens at nightfall); text inside uses light colours regardless of the slice's day/night phase
          - The WebGL slice mounts only once the frame has scrolled near the viewport and pauses while off-screen; the SVG poster covers the frame before that and for no-WebGL visitors
          - The whole frame is one link to /building and carries `data-night` on the section while the slice is in its night phase; there are no interactive nodes inside the frame
          - Floor-directory labels (and other in-scene Html tags) are not mounted in this slice so they cannot cover the "Enter the building" chip; the tour at /building still shows them
        children:
          - name: billboard-copy
            selector: '.billboard__copy'
          - name: billboard-ctas
            selector: '.billboard__ctas'
          - name: BillboardFrame
            selector: '.billboard__frame'
            description: The live slice, linked to the tour

      - name: PitchSection
        selector: '[data-component="PitchSection"]'
        source: src/components/PitchSection.tsx
        description: One-paragraph Problem statement + kicker line
        children:
          - name: pitch-body
            selector: ".pitch-body"
          - name: pitch-kicker
            selector: ".pitch-kicker"

      - name: SpecSection
        selector: '[data-component="SpecSection"]'
        source: src/components/SpecSection.tsx
        description: The three-concept section — Views, Components, Requests — with YAML + enriched-output pairs
        memory:
          - Each subsection uses the `.concept` wrapper with a numbered header (`.concept-num`)
          - Running example across all three subsections is the flight-search app
        children:
          - name: concept
            selector: ".concept"
          - name: concept-grid
            selector: ".concept-grid"
          - name: schema-table
            selector: ".schema-table"
          - name: callout
            selector: ".callout"

      - name: MemorySection
        selector: '[data-component="MemorySection"]'
        source: src/components/AgentSection.tsx
        description: The Memory section — YAML + enriched output pair, three points
        memory:
          - Filename is `AgentSection.tsx` for historical reasons; the section data-component is `MemorySection`
        children:
          - name: memory-grid
            selector: ".memory-grid"
          - name: memory-points
            selector: ".memory-points"
          - name: memory-point
            selector: ".memory-point"

      - name: GetStarted
        selector: '[data-component="GetStarted"]'
        source: src/components/CTASection.tsx
        description: Three-step Get Started — Install the CLI + skills, Start a session and iterate, and Let the agent curate
        memory:
          - Filename is `CTASection.tsx` for historical reasons; the section data-component is `GetStarted`
          - Steps live in `.gs-steps`; each row is a `.gs-step` with `.gs-step-num` + `.gs-step-body`
          - Step 03 carries the `agent-driven` badge (`.gs-step-badge`); steps 01 and 02 have none
          - Step 03's code block is a prompt to the agent, not shell — the bundled `sightmap-authoring` skill does the curation
        children:
          - name: gs-steps
            selector: ".gs-steps"
          - name: gs-step
            selector: ".gs-step"
          - name: gs-ctas
            selector: ".gs-ctas"

  - name: BlogIndex
    route: /blog
    description: Reverse-chronological list of published posts
    source: src/pages/BlogIndex.tsx
    memory:
      - Drafts are filtered out here; reach one directly at /blog/<slug>?preview=true
    components:
      - name: BlogCard
        selector: '[data-component="BlogCard"]'
        source: src/components/BlogCard.tsx
        description: One post summary — topic, date, title, excerpt
        properties:
          - name: title
            extract: blog-card-title.text
          - name: topic
            extract: blog-card-topic.text
        children:
          - name: blog-card-title
            selector: '.blog-card__title'
            properties:
              - name: text
                extract: text
          - name: blog-card-topic
            selector: '.blog-card__meta span'
            properties:
              - name: text
                extract: text
          - name: blog-card-excerpt
            selector: '.blog-card__excerpt'

  - name: BlogPost
    route: /blog/:slug
    description: A single post — header, article body, and any embedded figures
    source: src/pages/BlogPost.tsx
    memory:
      - Body HTML is inlined by the prerender into a script#__SIGHTMAP_POST__ tag and read synchronously on first render, so hydration matches
      - Interactive figures are authored as <div data-widget="..."> in the markdown and swapped by src/components/blog/widgets.tsx
      - "Draft posts render a fixed banner (top: 56px, below the nav) and redirect to /blog without ?preview=true"
      - The prerender skips drafts entirely, so a draft post has no page in dist/
      - "Code blocks carry `[data-component=\"CodeBlock\"]` but a post renders many of them, so the hook is deliberately left unmapped — reach one through PostBody instead"
      - CodeBlock's expanded view is portalled to document.body, so it lands outside the post's subtree and a second `.blog-code` appears while it is open
    components:
      - name: SightmapSnapshot
        selector: '.smap-widget'
        source: src/components/blog/SightmapSnapshot.tsx
        description: Toggles one accessibility tree between raw and sightmap-enriched
        memory:
          - The checkout figure defaults to raw; the datepicker figure defaults to sightmap
        children:
          - name: smap-widget-controls
            selector: '.smap-widget__controls'
          - name: smap-widget-guide
            selector: '.smap-widget__guide'
      - name: SkillVsSightmap
        selector: '.smap-svs'
        source: src/components/blog/SkillVsSightmap.tsx
        description: Static SVG contrasting skill-dump context with contextual disclosure
      - name: PostHeader
        selector: '.blog-post__header'
        source: src/pages/BlogPost.tsx
        description: Identifies the post being read — topic, date, title and byline
      - name: PostBody
        selector: '.prose'
        source: src/pages/BlogPost.tsx
        description: The post's rendered markdown body, including its code blocks and embedded figures
      - name: BackToBlog
        selector: '.blog-post__back'
        source: src/pages/BlogPost.tsx
        description: Returns to the post index from a post

  - name: AtlasIndex
    route: /atlas
    description: One card grid of WebMCP directory listings and community sightmaps, with type, category and text filters, a "how listing works" strip, and the submit-for-a-scan form
    source: src/pages/AtlasIndex.tsx
    memory:
      - Two kinds of card share the grid — DirectoryCard for a scanned WebMCP listing (live or demo) and AtlasCard for a vendored community map — sorted newest-first across both by `updated`
      - Both come from src/generated/atlas-manifest.ts, generated by scripts/build-atlas.ts — `atlasEntries`/`atlasCategories` from src/data/atlas/, `directoryListings`/`directoryCategories` from src/data/directory/
      - "Filter state lives in the query string (?type=&category=&q=); empty values are dropped, so /atlas is the unfiltered URL"
      - "?type= takes live | demo | community; an unrecognised value is treated as no filter rather than as an empty gallery"
      - The category chip row is the union of an entry's `categories` and a listing's single `category`, so one row filters both kinds
      - "The submit form reads three more params: ?url= prefills the URL, ?rescan=1 marks it a rescan (both come from a listing's \"Request a rescan\" link), and ?submitted=<id> is where the no-JS form post redirects back to"
      - The first render always ignores the query string and an effect applies it after mount — the prerender writes one unfiltered file for this route, so reading params during render would be a hydration mismatch
      - Typing in the search box replaces the history entry; clicking a type or a category pushes one
      - Site marks are monogram tiles drawn from the domain, never fetched favicons — the page makes no third-party request
      - "Nothing on a card is a grade: counts, a surface and a scan date only. Tool kinds are classified by Atlas and corrected on review"
    components:
      - name: AtlasFilters
        selector: '[data-component="AtlasFilters"]'
        source: src/pages/AtlasIndex.tsx
        description: Search input plus the type and category chip rows; the active chip in each row carries aria-pressed
        children:
          - name: atlas-filters-search
            selector: '.atlas-filters__search input'
          - name: atlas-chip
            selector: '.atlas-chip'

      - name: AtlasTypeFilter
        selector: '[data-component="AtlasTypeFilter"]'
        source: src/pages/AtlasIndex.tsx
        description: The coarse cut ahead of the categories — All, Live, Demo, Community maps — written to the URL as ?type=
        memory:
          - "The chips map to ?type= values: All clears it, Live and Demo filter listings by their `type`, Community maps shows only the vendored atlas entries"
          - Nested inside AtlasFilters in the DOM, so its chips also resolve under that component
        children:
          - name: atlas-type-chip
            selector: '.atlas-chip'

      - name: AtlasCard
        selector: '[data-component="AtlasCard"]'
        source: src/components/atlas/AtlasCard.tsx
        description: One community map summary — screenshot, mark, name, method pill, stats, author, updated
        properties:
          - name: site
            extract: atlas-card-name.text
          - name: method
            extract: atlas-card-method.text
        memory:
          - The whole card is the link to /atlas/<slug>; there is no inner call to action
          - An entry with no screenshots renders a typographic fallback panel in place of the image
          - "`method` extracts as the rendered text, which CSS uppercases: the property reads BROWSER where the manifest data says browser"
        children:
          - name: atlas-card-name
            selector: '.atlas-card__name'
            properties:
              - name: text
                extract: text
          - name: atlas-card-method
            selector: '.atlas-card__method'
            properties:
              - name: text
                extract: text
          - name: atlas-card-stats
            selector: '.atlas-card__stats'

      - name: DirectoryCard
        selector: '[data-component="DirectoryCard"]'
        source: src/components/atlas/DirectoryCard.tsx
        description: One WebMCP listing summary — tool count and kind breakdown, mark, name, live/demo pill, surface, badges, category and scan date
        properties:
          - name: name
            extract: directory-card-name.text
          - name: type
            extract: directory-card-type.text
          - name: tools
            extract: directory-card-tools.text
        memory:
          - Shares `.atlas-card` with AtlasCard so the mixed grid keeps one card shape; the screenshot band is replaced by the tool-count strip because a listing has no screenshot
          - The whole card is the link to /atlas/<slug>
          - "`type` extracts as the rendered text, which CSS uppercases: the property reads LIVE where the manifest data says live"
          - The date in the footer is the scan date, not the listing date — how stale the tool list is, is the fact a visitor needs
          - "Badges are factual and conditional: \"Built with Sightkick\" when the listing says so, \"Journey passed\" only when a stored journey exists and passed"
        children:
          - name: directory-card-name
            selector: '.atlas-card__name'
            properties:
              - name: text
                extract: text
          - name: directory-card-type
            selector: '.atlas-type'
            properties:
              - name: text
                extract: text
          - name: directory-card-tools
            selector: '.atlas-card__toolcount'
            properties:
              - name: text
                extract: text
          - name: directory-card-kinds
            selector: '.atlas-card__kinds'
          - name: directory-card-badges
            selector: '.atlas-card__badges'

      - name: AtlasSubmitCard
        selector: '[data-component="AtlasSubmitCard"]'
        source: src/components/atlas/AtlasSubmitCard.tsx
        description: Trailing invitation in the card grid — jumps to the scan form below the grid, with a secondary link out to the community-map contribution guide
        memory:
          - The card is a wrapper, not one big link — the primary jump is an in-page `#submit` anchor and the CONTRIBUTING.md link sits beside it, because nesting the second inside the first would be invalid HTML
        children:
          - name: atlas-submit-card-link
            selector: '.atlas-card__submit-link'
          - name: atlas-submit-card-aside
            selector: '.atlas-card__submit-aside'

      - name: AtlasHow
        selector: '[data-component="AtlasHow"]'
        source: src/pages/AtlasIndex.tsx
        description: Three-step strip explaining what happens between a submitted URL and a published listing — scan, review, report
        memory:
          - "Step 01 says the scan enumerates tools without executing them; that is a factual claim about the pipeline, not marketing copy"
        children:
          - name: atlas-how-step
            selector: '.atlas-how__step'

      - name: AtlasSubmitForm
        selector: '[data-component="AtlasSubmitForm"]'
        source: src/components/atlas/AtlasSubmitForm.tsx
        description: Submit a site for a free scan — URL, email, three checkboxes, an optional intent, and the "Scan my site" button
        memory:
          - A real `<form method="post">` posting to SUBMIT_ENDPOINT (src/lib/submit-types.ts) that works with scripting off; with JS the submit handler intercepts and posts the same fields as JSON so the visitor stays on the page
          - "Four states: idle, sending (the button reads \"Sending…\" and is disabled), received (the form is replaced by a reference id and the one-business-day line), and error (an alert beside the button)"
          - "Arriving at /atlas?submitted=<id>#submit — where the no-JS post redirects — renders the received state directly, so both paths end on the same confirmation"
          - "?url= and ?rescan=1 prefill the form; the rescan flag is carried in a hidden input and never shown"
          - "The `website` input is a honeypot: positioned off-canvas, out of the tab order and aria-hidden, so no field is announced or reachable for a person"
          - The section carries id="submit", which is what AtlasSubmitCard and a listing's "Request a rescan" link jump to
        children:
          - name: atlas-submit-fields
            selector: '[data-component="AtlasSubmitFields"]'
          - name: submit-url
            selector: '[data-component="SubmitUrl"]'
          - name: submit-email
            selector: '[data-component="SubmitEmail"]'
          - name: submit-owner
            selector: '[data-component="SubmitOwner"]'
          - name: submit-sightkick
            selector: '[data-component="SubmitSightkick"]'
          - name: submit-nominate
            selector: '[data-component="SubmitNominate"]'
          - name: submit-intent
            selector: '[data-component="SubmitIntent"]'
          - name: submit-button
            selector: '[data-component="SubmitButton"]'
          - name: atlas-submit-received
            selector: '.atlas-submit-form__received'

      - name: AtlasMachineHint
        selector: '.atlas-index__machine'
        source: src/pages/AtlasIndex.tsx
        description: Points agents at the three machine-readable indexes for the gallery — /atlas/directory.json (listings), /atlas/stats.json (counts), /atlas/index.json (community maps)

  - name: AtlasListing
    route: /atlas/:slug
    description: Spec sheet for one WebMCP listing — facts strip, tools grouped by page, checks, journeys, drift, the Sightkick starter, share block and metadata rail
    source: src/pages/AtlasListing.tsx
    memory:
      - "AtlasEntry shares this route: src/pages/AtlasSlug.tsx is the element on `<Route path=\"/atlas/:slug\">` and picks the page by slug — AtlasListing when the slug is in `directoryListings`, AtlasEntry otherwise. Slugs are unique across both, so exactly one matches"
      - An unknown slug redirects to /atlas; the prerender only writes files for slugs present in the manifest
      - "Nothing here is a grade. The classification of a tool as read/action/sensitive is Atlas's own and is corrected on review; a listing is evidence a scan found these tools on the date shown, not a safety certification — the page says so in its footnote"
      - Tools are grouped by the page they were first seen on, because a WebMCP surface is route-scoped — what an agent can call depends on which page it is standing on
      - "Tool names, descriptions, warnings and input schemas come off a third-party page and are rendered as React text nodes only; the schema `<pre>` is JSON.stringify output, never dangerouslySetInnerHTML"
      - "The starter is built at build time by scripts/lib/sightkick-starter.ts: a replayable verification transcript when the scan found tools, a drafted .sightkick/tools.yaml plus a personalised agent prompt when it found none"
      - "Machine twins for the same listing live at /atlas/sites/<slug>.json, /atlas/sites/<slug>/tools.json, /atlas/scans/<slug>.json and /atlas/<slug>.md; the share badge image is /atlas/<slug>/badge.svg"
      - AtlasListing reuses the blog's `.blog-post__back` class for its back link and AtlasEntry's `.atlas-meta`, `.atlas-chip`, `.atlas-entry__eyebrow`, `.atlas-entry__desc` and `.atlas-entry__cats` classes, so none of those selectors is unique to this page
      - "\"Request a rescan\" is a plain anchor, not a router link: a full navigation is what makes the browser honour the #submit fragment and land on the form already prefilled from ?url= and ?rescan=1"
    components:
      - name: ListingHeader
        selector: '[data-component="ListingHeader"]'
        source: src/pages/AtlasListing.tsx
        description: Host eyebrow, name, type/surface/Sightkick/label pills, description and the category chip
        properties:
          - name: host
            extract: listing-eyebrow.text
          - name: type
            extract: listing-type.text
        memory:
          - The eyebrow links out to the listed site itself and is marked nofollow ugc, because listings are submitted rather than editorial
          - The category chip links back into the gallery's own filter at /atlas?category=<category>
        children:
          - name: listing-eyebrow
            selector: '.atlas-entry__eyebrow'
            properties:
              - name: text
                extract: text
          - name: listing-type
            selector: '.atlas-type'
            properties:
              - name: text
                extract: text
          - name: listing-pills
            selector: '.atlas-listing__pills'
          - name: listing-category
            selector: '.atlas-chip'

      - name: ListingFacts
        selector: '[data-component="ListingFacts"]'
        source: src/pages/AtlasListing.tsx
        description: The five observable facts — tools found, pages checked, checks passed x/y, last scanned, listed since
        memory:
          - "Every cell is a count or a date; there is deliberately no score, letter or star anywhere in this strip"
        children:
          - name: listing-fact
            selector: '.atlas-facts__item'
          - name: listing-fact-label
            selector: '.atlas-facts__label'
          - name: listing-fact-value
            selector: '.atlas-facts__value'

      - name: ListingTools
        selector: '[data-component="ListingTools"]'
        source: src/pages/AtlasListing.tsx
        description: The scanned tools, grouped by the page each was first seen on, each with its kind chip, description, Atlas's reason for the classification, any warnings, and a collapsed input schema
        properties:
          - name: name
            extract: atlas-tool-name.text
          - name: kind
            extract: atlas-tool-kind.text
        memory:
          - "The extracted `name` and `kind` are the first tool row on the page — `.atlas-tool` matches every row, so iterate the children rather than reading the property when more than one tool is listed"
          - A page the scan visited but which registered nothing gets no group here; the facts strip already reports how many pages were checked
          - "The kind chip carries one of `.atlas-kind--read`, `.atlas-kind--action` or `.atlas-kind--sensitive` — three distinct colours for three categories, not a scale"
          - The input schema sits inside a closed `<details>`, so its `<pre>` is in the DOM but not visible until opened
        children:
          - name: atlas-tools-page
            selector: '.atlas-tools__page'
          - name: atlas-tool
            selector: '.atlas-tool'
          - name: atlas-tool-name
            selector: '.atlas-tool__name'
            properties:
              - name: text
                extract: text
          - name: atlas-tool-kind
            selector: '.atlas-kind'
            properties:
              - name: text
                extract: text
          - name: atlas-tool-schema
            selector: '.atlas-tool__schema'

      - name: ListingChecks
        selector: '[data-component="ListingChecks"]'
        source: src/pages/AtlasListing.tsx
        description: What the scan could observe, one line each, under the heading "Facts, not grades"
        memory:
          - A failed check renders with a "!" glyph and the `.atlas-checks__item--off` modifier; it is a note, not a deduction from a score
        children:
          - name: listing-check
            selector: '.atlas-checks__item'
          - name: listing-check-detail
            selector: '.atlas-checks__detail'

      - name: ListingJourneys
        selector: '[data-component="ListingJourneys"]'
        source: src/pages/AtlasListing.tsx
        description: What the review thought an agent could try with these tools — an intent and the tools it would use
        memory:
          - Suggested, not run. The copy says so explicitly so it is not mistaken for the stored journey below it
        children:
          - name: listing-suggested-journey
            selector: '.atlas-listing__journey-intent'

      - name: ListingStoredJourney
        selector: '[data-component="ListingStoredJourney"]'
        source: src/pages/AtlasListing.tsx
        description: The one supervised, read-only run a maintainer performed — intent, outcome, date, tools called, duration and notes
        properties:
          - name: outcome
            extract: listing-journey-outcome.text
        memory:
          - Rendered only when the listing carries a `journey`; most listings have none
          - "The block carries `.atlas-listing__journey--passed` or `--failed`, which is the only place on the page an outcome is colour-coded"
        children:
          - name: listing-journey-outcome
            selector: 'dd'
            properties:
              - name: text
                extract: text
          - name: listing-journey-facts
            selector: '.atlas-listing__journey-facts'

      - name: ListingDrift
        selector: '[data-component="ListingDrift"]'
        source: src/pages/AtlasListing.tsx
        description: What the latest rescan changed in the tool set since the scan before it, as added and removed lists
        memory:
          - Rendered only when a listing has more than one scan on file and the two differ; the heading names the date it is comparing against
        children:
          - name: listing-drift-side
            selector: '.atlas-listing__drift-side'
          - name: listing-drift-label
            selector: '.atlas-listing__drift-label'

      - name: ListingReview
        selector: '[data-component="ListingReview"]'
        source: src/pages/AtlasListing.tsx
        description: The review's short factual lines, as Strong and Could improve columns
        children:
          - name: listing-review-col
            selector: '.atlas-listing__col-label'
          - name: listing-review-bullets
            selector: '.atlas-listing__bullets'

      - name: ListingStarter
        selector: '[data-component="ListingStarter"]'
        source: src/pages/AtlasListing.tsx
        description: The Sightkick starter every submitter gets — a copyable transcript or drafted tool layer, plus a collapsed prompt for a coding agent
        memory:
          - "Two shapes, chosen at build time by what the scan found: a replayable verification transcript when tools were found, a drafted `.sightkick/tools.yaml` when none were. The heading is the starter's own title, so it differs between listings"
          - Each block has its own copy button; the label toggles to "Copied" for 2s and only on a copy that actually succeeded
          - The agent prompt sits inside a closed `<details>` so the long text does not dominate the page
        children:
          - name: listing-starter-code
            selector: '.atlas-starter__code'
          - name: listing-starter-copy
            selector: '.atlas-starter__copy'
          - name: listing-starter-prompt
            selector: '.atlas-starter__prompt'

      - name: ListingShare
        selector: '[data-component="ListingShare"]'
        source: src/pages/AtlasListing.tsx
        description: Share on X, share on LinkedIn, copy link, and the embeddable badge with its markdown snippet
        memory:
          - "The share text states a tool count and the scan's provenance and nothing else — no \"verified\", no \"safe\""
          - The badge image is served from /atlas/<slug>/badge.svg and the markdown links it back to the listing, so a badge is always checkable
        children:
          - name: listing-share-link
            selector: '.atlas-share__link'
          - name: listing-badge
            selector: '.atlas-share__badge'
          - name: listing-badge-snippet
            selector: '.atlas-share__snippet'

      - name: ListingMeta
        selector: '[data-component="ListingMeta"]'
        source: src/pages/AtlasListing.tsx
        description: Provenance rail for the listing — type, surface, status, scan date, scanner, who submitted it, when it was listed and last updated
        properties:
          - name: status
            extract: listing-meta-status.text
        memory:
          - A row is omitted entirely rather than left blank when its value is absent, so the rail's row count varies by listing
          - "Statuses are observable outcomes only (tools-found, api-empty, api-absent, blocked, load-error, needs-review); there is deliberately no safe, trusted or certified"
          - The rail ends with the machine-readable twins and two actions — request a rescan, report a problem
        children:
          - name: listing-meta-status
            selector: 'dd'
            properties:
              - name: text
                extract: text
          - name: ListingMetaMachine
            selector: '.atlas-meta__machine'
            description: Links to the machine-readable twins of this listing
          - name: listing-meta-actions
            selector: '.atlas-listing__actions'

      - name: BackToAtlasFromListing
        selector: '.blog-post__back'
        source: src/pages/AtlasListing.tsx
        description: Returns to the gallery from a listing

  - name: AtlasEntry
    route: /atlas/:slug
    description: Spec sheet for one atlas entry — install command, screenshots, per-view table, README prose, metadata rail
    source: src/pages/AtlasEntry.tsx
    memory:
      - An unknown slug redirects to /atlas; the prerender only writes files for entries present in index.json
      - The README body is rendered to HTML at build time by scripts/lib/atlas.ts, which escapes raw HTML and allowlists URL schemes because entries are community-authored
      - README headings are demoted one level so the page keeps a single h1
      - Machine twins for the same entry live at /atlas/<slug>.md and /atlas/index.json
      - The corpus that `sightmap atlas add` pulls is served from /atlas/<slug>.tar.gz, written by scripts/build-atlas.ts
      - "The rendered README reuses the page's own `.atlas-table` and `.atlas-table-wrap` classes, so neither is unique on an entry page — scope table selectors under `.atlas-views`"
      - AtlasEntry reuses the blog's `.blog-post__back` class for its back link, so that selector resolves on both /blog/:slug and /atlas/:slug
      - "AtlasListing shares this route: src/pages/AtlasSlug.tsx is the element on `<Route path=\"/atlas/:slug\">` and renders AtlasListing when the slug is in `directoryListings`, this page otherwise"
    components:
      - name: AtlasInstall
        selector: '[data-component="AtlasInstall"]'
        source: src/components/atlas/AtlasInstall.tsx
        description: The `sightmap atlas add <slug>` command with a copy button
        properties:
          - name: command
            extract: atlas-install-cmd.text
        memory:
          - The button label toggles to "Copied" for 2s and only on a copy that actually succeeded
        children:
          - name: atlas-install-cmd
            selector: '.atlas-install__cmd'
            properties:
              - name: text
                extract: text
          - name: atlas-install-copy
            selector: '.atlas-install__copy'

      - name: AtlasMeta
        selector: '[data-component="AtlasMeta"]'
        source: src/pages/AtlasEntry.tsx
        description: Provenance rail for the entry — how and when it was captured, by whom, against which CLI and spec version
        properties:
          - name: lastVerified
            extract: atlas-meta-verified.text
          - name: commit
            extract: atlas-meta-commit.text
        memory:
          - A row is omitted entirely rather than left blank when its value is absent, so the rail's row count varies by entry
        children:
          - name: atlas-meta-verified
            selector: 'time'
            properties:
              - name: text
                extract: text
          - name: atlas-meta-commit
            selector: 'code'
            properties:
              - name: text
                extract: text
          - name: AtlasMetaMachine
            selector: '.atlas-meta__machine'
            description: Links to the machine-readable twins of this entry

      - name: EntryEyebrow
        selector: '.atlas-entry__eyebrow'
        source: src/pages/AtlasEntry.tsx
        description: Links out to the mapped site itself, marked nofollow because entries are community-submitted

      - name: EntryCategories
        selector: '.atlas-entry__cats'
        source: src/pages/AtlasEntry.tsx
        description: Category chips that link back into the gallery's filter, so a category finds neighbouring entries

      - name: EntryScreenshots
        selector: '.atlas-figs'
        source: src/pages/AtlasEntry.tsx
        description: Captured screenshots for the entry, captioned from the vendored filenames

      - name: EntryViews
        selector: '.atlas-views'
        source: src/pages/AtlasEntry.tsx
        description: Per-view breakdown of what the entry's corpus covers — route, component and request counts
        children:
          - name: EntryViewsTable
            selector: '.atlas-table'

      - name: EntryBody
        selector: '.atlas-body'
        source: src/pages/AtlasEntry.tsx
        description: The entry's README prose, rendered from community-authored markdown at build time

      - name: BackToAtlas
        selector: '.blog-post__back'
        source: src/pages/AtlasEntry.tsx
        description: Returns to the gallery from an entry

  - name: Developers
    route: /developers
    description: Sightmap developer resources — OpenAPI, Atlas HTTP API, docs, CLI, and skills
    source: src/pages/Developers.tsx
    memory:
      - Title and h1 both contain "Sightmap developer resources" so name-based search can find this page
      - The public API is read-only and unauthenticated; that is stated in the header copy
      - Machine twins live at /developers.md, /openapi.json, and /api/openapi.yaml
    components:
      - name: DeveloperResource
        selector: '.developers__item'
        source: src/pages/Developers.tsx
        description: One developer resource — title, what it is, and its URL

  - name: Building
    route: /building
    description: Scroll-driven 3D tour of the app-as-a-building metaphor — code as blueprint, the running app as the building, the sightmap as its wayfinding, agents as the people inside
    source: src/pages/Building.tsx
    dependencies:
      - src/components/building/**
      - src/building.css
    memory:
      - The WebGL scene (src/components/building/Scene.tsx) mounts only after a client effect and is code-split; the prerendered HTML carries the SVG poster and the full chapter text, so the page reads without JS or WebGL
      - Scroll position drives the scene — each `.bld-chapter` section is one chapter and the active one carries `data-active="true"`; the canvas itself is aria-hidden and has no interactive nodes
      - Chapter copy lives in src/components/building/chapters.ts, not in the page component
      - "Chapters 05–07 (self-healing tests, trajectories, Web MCP tools) describe exploratory work and carry the `exploratory` badge; they are not shipped features"
    components:
      - name: BuildingNav
        selector: '[data-component="BuildingNav"]'
        source: src/components/building/BuildingNav.tsx
        description: Page-local header — logo home link plus Home, Docs and GitHub; swaps to a dark treatment at nightfall
      - name: BuildingStage
        selector: '[data-component="BuildingStage"]'
        source: src/components/building/BuildingExperience.tsx
        description: Fixed full-viewport stage holding the SVG poster and, once mounted, the WebGL canvas
        children:
          - name: BuildingPoster
            selector: '[data-component="BuildingPoster"]'
            description: Static isometric blueprint illustration — the prerendered fallback, faded out once the scene renders
      - name: BuildingChapter
        selector: '[data-component="BuildingChapter"]'
        source: src/components/building/BuildingExperience.tsx
        description: One scroll chapter of the story — eyebrow, heading, body, and an optional call to action
        properties:
          - name: chapter
            extract: attr=data-chapter
          - name: active
            extract: attr=data-active
        children:
          - name: bld-card
            selector: '.bld-card'
          - name: bld-card-ctas
            selector: '.bld-card__ctas'
      - name: BuildingHud
        selector: '[data-component="BuildingHud"]'
        source: src/components/building/BuildingExperience.tsx
        description: Desktop-only readout in the top right — three live-looking figures that change with the chapter
      - name: BuildingRail
        selector: '[data-component="BuildingRail"]'
        source: src/components/building/BuildingExperience.tsx
        description: Bottom progress rail — one button per chapter, the current one pressed; clicking scrolls to that chapter
        children:
          - name: bld-rail-dot
            selector: '.bld-rail__dot'

  - name: NotFound
    route: '*'
    description: Catch-all 404 page for any unmatched route
    source: src/pages/NotFound.tsx
    memory:
      - "netlify.toml's catch-all serves dist/404.html with HTTP 404; the negotiate edge function may replace that body with markdown or JSON based on Accept"
      - Recovery links (llms.txt, sitemap, /developers, docs) are on the HTML page so an agent that got HTML can still continue
      - The prerender writes one unstamped dist/404.html; main.tsx mounts fresh for the actual URL

components:
  - name: Navigation
    selector: '[data-component="Navigation"]'
    source: src/components/Navigation.tsx
    description: Persistent site header — the route into the homepage's spec sections plus the atlas, blog, docs and repo
    children:
      - name: nav-logo
        selector: ".nav-logo"
      - name: nav-links
        selector: ".nav-links"
      - name: nav-gh
        selector: ".nav-gh"

  - name: Footer
    selector: '[data-component="Footer"]'
    source: src/components/Footer.tsx
    description: Site-wide attribution and the full secondary link set (including Developers), plus the only entry point to the privacy preferences dialog
    memory:
      - The banner auto-shows once and never again once a choice is stored, so the "Privacy preferences" button here is the only route back to the consent dialog
    children:
      - name: footer-links
        selector: ".footer-links"
      - name: PrivacyPreferences
        selector: '[data-action="consent-open-preferences"]'
        description: Reopens the consent dialog so the analytics-capture choice can be changed

  - name: ConsentBanner
    selector: '[data-component="ConsentBanner"]'
    source: src/components/consent/ConsentUI.tsx
    description: First-visit ask for analytics-capture consent — accept, decline, and a link out to the privacy policy
    memory:
      - Never present in the prerendered HTML; it mounts only after a client effect, so nothing in dist/ and no JS-disabled load has a banner
      - "`.consent-copy` and `.consent-actions` are shared with the preferences dialog, but ConsentUI renders one or the other and never both, so they stay single-match"
    children:
      - name: ConsentCopy
        selector: '.consent-copy'
      - name: ConsentActions
        selector: '.consent-actions'
