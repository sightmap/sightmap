version: 1

views:
  - name: SearchResults
    route: /search
    url: https://vuoriclothing.com/search?q=shorts
    description: Search results — the same filter bar and product grid the collection pages use.
    memory:
      - Reachable by URL alone as `/search?q=<terms>`, with no need to open the
        header search control.
      - Structurally the same page as a collection. The filter bar, product row,
        and card are the identical components, so one set of selectors covers
        both surfaces.
      - Search is Algolia-backed, which is where the `queryId` on outgoing
        product links comes from.
    components:
      - name: FilterBar
        selector: '[data-testid="filter-bar"]'
        properties:
          - name: result_summary
            extract: text

      - name: ProductRow
        selector: '[data-testid="Plp-ConnectedProductRow"]'

      - name: ProductCard
        selector: '[data-testid="productCard"]'
        properties:
          - name: product_url
            extract: attr=href
          - name: card_text
            extract: text
        children:
          - name: CardHoverBox
            selector: '[data-testid="productCardHoverBox"]'
