version: 1

views:
  - name: NotFound
    route: /**
    url: https://www.ebay.com/no-such-page-xyz-123
    description: Catch-all error page served for any unmatched path.
    memory:
      - Reached by any path that matches no other route, which no page links to
        — a link crawl will never find it.
      - It renders the full global header, the search form, and the footer, so
        "the chrome is present" is not evidence that a real page loaded. The
        reliable signals are the title (`Error Page | eBay`) and the presence of
        `.error-page-v2`.
      - The heading reads "We looked everywhere." with no mention of a status
        code, so an agent matching on the string "404" will not recognize it.
    components:
      - name: ErrorPage
        selector: '.error-page-v2'
        children:
          - name: ErrorTitle
            selector: '.error-header-v2__title'
            properties:
              - name: message
                extract: text
