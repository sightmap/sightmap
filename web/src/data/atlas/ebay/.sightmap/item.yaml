version: 1

views:
  - name: ItemDetail
    route: /itm/:itemId
    url: https://www.ebay.com/itm/264476753478
    description: A single listing — gallery, title, price, quantity, buy actions, shipping, and returns.
    memory:
      - The only route with a full `data-testid` vocabulary. Every fact worth
        reading has an `x-` prefixed testid, so no class-name guessing is needed
        here.
      - Query parameters on `/itm/` URLs are all tracking. `/itm/:itemId` alone
        serves the identical page.
      - What renders depends on how the listing sells — an auction shows a bid
        count and a countdown where a fixed-price listing shows `x-bin-price`.
        Branch on presence rather than assuming a block is there.
    components:
      - name: ItemMain
        selector: '[data-testid="x-vi-evo-main-container"]'
        children:
          - name: ItemTitle
            selector: '[data-testid="x-item-title"]'
            properties:
              - name: title
                extract: text
          - name: PriceSection
            selector: '[data-testid="x-price-section"]'
            properties:
              - name: price
                extract: text
            memory:
              - Holds whichever price applies — `x-bin-price` on a fixed-price
                listing, the current bid on an auction.
          - name: QuantityPanel
            selector: '[data-testid="x-quantity"]'
            properties:
              - name: availability
                extract: text
          - name: BuyBoxActions
            selector: '[data-testid="x-buybox-cta"]'
            memory:
              - Buy It Now, Add to cart, Make offer, and Add to Watchlist all
                live here, and which of them render depends on the listing.
                Resolve an action by its label, never by position.
          - name: VolumePricing
            selector: '[data-testid="x-volume-pricing"]'
            memory:
              - Renders only when the seller set up bulk pricing tiers, which
                most listings have not. Absent is the normal case.
          - name: WatcherSignals
            selector: '[data-testid="x-wtb-signals"]'
            properties:
              - name: signal_text
                extract: text
          - name: ShippingSummary
            selector: '[data-testid="d-shipping-minview"]'
            properties:
              - name: shipping_text
                extract: text
          - name: ReturnsSummary
            selector: '[data-testid="x-returns-minview"]'
            properties:
              - name: returns_text
                extract: text

      - name: PhotoGallery
        selector: '[data-testid="x-photos"]'
        memory:
          - Thumbnails swap the main image in place with no navigation, so the
            URL never says which photo is showing.
        children:
          - name: GalleryMainView
            selector: '[data-testid="x-photos-min-view"]'

      - name: RecommendationSlot
        selector: '[data-testid="x-pda-placements"]'
        memory:
          - Sponsored placements whose contents change per load. Nothing inside
            is stable enough to assert against.
