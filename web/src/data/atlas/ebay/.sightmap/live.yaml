version: 1

views:
  - name: LiveHub
    route: /ebaylive
    url: https://www.ebay.com/ebaylive
    description: eBay Live hub — a filterable feed of live and upcoming shopping streams.
    memory:
      - The category filter is a set of buttons inside a real `form`, and
        pressing one re-filters the feed in place without changing the URL. The
        selected category is therefore invisible from the address bar, unlike
        every other browse surface on the site.
      - Individual streams live at `/ebaylive/events/:eventId/stream` and sellers
        at `/ebaylive/sellers/:sellerId`. Both ids are opaque strings, not the
        numeric ids used for listings and categories.
    components:
      - name: LiveFeed
        selector: '.dp-filtered-feed-module'
        children:
          - name: LiveFeedItem
            selector: '.dp-subgrid-item'
            properties:
              - name: item_text
                extract: text

      - name: LiveFilters
        selector: 'form[aria-label="Primary filter"]'
        memory:
          - Buttons, not links. There is no href to follow, so filtering here is
            the one browse action on the site that requires a click.
          - Anchor to the `form`, not to the `.primary-filters` div inside it.
            The div misses the form element itself, which is what carries the
            accessible name.

      - name: LiveEventsCarousel
        selector: '#dp-live-events-carousel'
