version: 1

memory:
  - Server-rendered on every route — the HTML that arrives already contains the
    listings, so a snapshot taken right after navigation already has the content
    you came for. Nearly all of the XHR that follows is advertising, tracking,
    and header personalization.
  - The two exceptions are both on the listing surfaces and both fire on scroll,
    so neither is visible in a snapshot of an unscrolled page. Search and
    category browse share them, because category browse is served by the same
    search stack — the giveaway is that both endpoints live under `/sch/ajax/`
    even on a `/b/` URL. The item page has no content XHR at all.
  - A cold browser profile is met with a proof-of-work splash at
    `/splashui/challenge` before the requested page is served. The browser
    answers it on its own with `argon2.wasm` and then follows through to the
    real URL, so the only symptom is a slower first page and a `document.referrer`
    pointing at `/splashui/challenge` rather than at wherever you actually came
    from.
  - Class names come in two families and only one is safe. Prefixed names
    (`gh-`, `srp-`, `brw-`, `x-refine__`) are structural and stable; bare
    two-to-six character names (`.esJT`, `._5hsT`, `.Jd4g`) are compiled output
    that changes between deploys. Never anchor to the short ones.
  - Every listing-bearing surface uses a different card class — `li.s-card` on
    search, `.brwrvr__item-card` on category browse, `.dp-subgrid-item` on eBay
    Live. There is no one card selector that spans the site.
  - The id `#mainContent` exists on all routes but wraps completely different
    subtrees per route, so it identifies the region and never the content.
    `[role="main"]` is present on search, category, and item pages but absent
    from the home page and the 404.

components:
  - name: GlobalHeader
    selector: '#gh'
    memory:
      - Identical markup on every route including the 404, which makes it useless
        as a signal that you are on a real page.
      - Sell, Watchlist, and My eBay are `.gh-flyout__target` — they open a
        hover panel rather than navigating, so a click that expects a page load
        gets a menu instead.
    children:
      - name: UtilityNav
        selector: '.gh-nav'
      - name: SearchForm
        selector: '#gh-f'
        memory:
          - A plain GET form, so search is reachable by URL alone —
            `/sch/i.html?_nkw=<terms>`. Everything else it submits is optional
            tracking.
        children:
          - name: SearchInput
            selector: '#gh-ac'
            properties:
              - name: query
                extract: attr=value
          - name: CategorySelect
            selector: '#gh-cat'
            properties:
              - name: category_id
                extract: attr=value

  - name: GlobalPromoBanner
    selector: '#gh-gb'
    memory:
      - A promotional strip that sits beside the header rather than inside it,
        so a walk that descends from `#gh` never reaches it. It is present on
        search and absent from most other routes.

  - name: FloatingHelp
    selector: '#infcontainer'
    memory:
      - A floating help launcher injected after the rest of the page settles, so
        a snapshot taken too early misses it entirely. It renders inside
        `#mainContent` despite floating over the viewport, which puts a
        site-wide widget inside what otherwise looks like per-route content.

  - name: GlobalFooter
    selector: '#glbfooter'
    memory:
      - The site-wide footer. `#dp-global-footer` wraps it on the home page and
        on eBay Live but is absent from search, category, and item pages —
        anchor to `#glbfooter`, which is present everywhere.
    children:
      - name: FooterLegal
        selector: '.gf-legal'

requests:
  - name: SearchAutocomplete
    route: /sch/ajax/autocomplete
    method: GET
    description: Typeahead suggestions for the global search box, fired as the query is typed.

  - name: HeaderUserProfile
    route: /gh/user_profile
    method: GET
    description: Personalizes the global header (signed-in name, cart count). Runs on every route and never affects page content.

  - name: SplashChallengeAnswer
    route: /splashui/challengesvc/answer
    method: POST
    description: Proof-of-work answer for the bot splash. Present only on the first page load of a cold profile.

  - name: TrackingTicketRedeem
    route: /nap/napkinapi/v1/ticketing/redeem
    method: GET
    description: Impression-tracking ticket redemption. Fires many times per page and carries no content.

  - name: HeaderUserAcquisition
    route: /gh/useracquisition
    method: GET
    description: Decides whether the sign-in prompt above the header is shown. Runs on every route alongside the profile call.
