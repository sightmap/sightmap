version: 1

views:
  - name: CategoryBrowse
    route: /b/:categoryName/:categoryId/:browseNode
    url: https://www.ebay.com/b/Toys-Hobbies/220/bn_1865497
    description: Category browse — breadcrumbs, a category tree, refinements, and a grid of item cards.
    memory:
      - The name segment is decorative. `/b/Totally-Made-Up-Name/220/bn_1865497`
        loads Toys & Hobbies and rewrites the path to the canonical name, so an
        agent must not read the category it is on out of the URL it requested.
      - Worse, a mismatched name and id pair resolves to an unrelated category
        rather than erroring. `/b/Cordless-Drills/184644/bn_1853799` serves
        Porcelain Nativity Items with a 200 and no warning. Confirm the landing
        category by reading `.textual-display` after load.
      - This is a different page from search with a different card class.
        `.brwrvr__item-card` here, `li.s-card` on `/sch/i.html`, and neither
        selector matches on the other route.
    components:
      - name: Breadcrumbs
        selector: '.seo-breadcrumbs-container'
        properties:
          - name: trail
            extract: text

      - name: CategoryHeading
        selector: '.textual-display'
        properties:
          - name: category_name
            extract: text
        memory:
          - The authoritative answer to "which category am I actually on", since
            the URL path cannot be trusted.

      - name: CategoryNav
        selector: '.brw-category-nav'
        children:
          - name: CategoryNavItem
            selector: '.brwel__item'

      - name: Refinements
        selector: '#brw-refinement-root'

      - name: BrowseControls
        selector: '#brw-controls-root'
        properties:
          - name: controls_text
            extract: text

      - name: PromoCarousel
        selector: '.brw-product-carousel'
        properties:
          - name: carousel_heading
            extract: text
        memory:
          - Merchandised carousels such as "Limited time deals" that sit above
            the item river. Their cards are `.brw-product-card`, a third card
            class distinct from both `.brwrvr__item-card` in the river below and
            `li.s-card` on search.
        children:
          - name: PromoCard
            selector: '.brw-product-card'

      - name: RecommendationCarousel
        selector: '.generic-host-carousel'
        memory:
          - The "You may also like" strip. Contents are personalized and rotate,
            so treat presence as optional.

      - name: EventModules
        selector: '.brw-uep'
        memory:
          - Editorial and event promos injected into the category page. Present
            on some categories and absent on others.

      - name: SeoLinkList
        selector: '.seo-expandable-list'
        memory:
          - Related-category links rendered for search engines. Useful as a
            cheap way to enumerate sibling categories without opening the nav.

      - name: RelatedSearchesNav
        selector: '#seo-related-search-container'
        memory:
          - A dozen related query links at the foot of the page. They point at
            `/sch/i.html?_nkw=`, so this is the one place on a category page that
            hands you keyword searches rather than more categories.

      - name: CategoryMain
        selector: '#mainContent'
        memory:
          - The page's `main` landmark. It carries no accessible name here, so it
            has to be matched by id — and the same id wraps a completely
            different subtree on every other route.

      - name: ItemRiver
        selector: '.brw-river'
        children:
          - name: BrowseItemCard
            selector: '.brwrvr__item-card'
            properties:
              - name: card_text
                extract: text
            children:
              - name: BrowseCardSignals
                selector: '.brwrvr__item-card__signals'
              - name: BrowseCardImageLink
                selector: '.brwrvr__item-card__image-link'
