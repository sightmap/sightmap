version: 1

views:
  - name: Home
    route: /
    url: https://sightmap.org/
    description: Marketing landing page — hero, pitch, spec and memory explainers, and install instructions.
    memory:
      - The five content sections are stacked on one route; the nav's Spec,
        Memory, and Get started links scroll to `#spec`, `#memory`, and `#start`
        rather than navigating. Treat this as a single view, not four.
      - The install command is inside a link, not a copy button — activating it
        navigates to npm instead of copying text.
    components:
      - name: Hero
        selector: '[data-component^="Hero"]'
        properties:
          - name: component_id
            extract: attr=data-component
        memory:
          - Both hero calls to action leave the site (docs.sightmap.org and github.com).
        children:
          - name: HeroDocsLink
            selector: 'a[href*="docs.sightmap.org"]'
          - name: HeroSpecLink
            selector: 'a[href*="github.com"]'

      - name: PitchSection
        selector: '[data-component^="PitchSection"]'
        properties:
          - name: component_id
            extract: attr=data-component

      - name: SpecSection
        selector: '[data-component^="SpecSection"]'
        properties:
          - name: component_id
            extract: attr=data-component

      - name: MemorySection
        selector: '[data-component^="MemorySection"]'
        properties:
          - name: component_id
            extract: attr=data-component

      - name: GetStarted
        selector: '[data-component^="GetStarted"]'
        properties:
          - name: component_id
            extract: attr=data-component
        memory:
          - The install command is rendered in a `code` element wrapped by the
            npm link; read it with the `command` property rather than scraping
            the anchor text, which also contains the surrounding copy.
        children:
          - name: InstallCommand
            selector: code
            properties:
              - name: command
                extract: text
          - name: GetStartedDocsLink
            selector: 'a[href*="docs.sightmap.org"]'
          - name: GetStartedGithubLink
            selector: 'a[href*="github.com"]'
