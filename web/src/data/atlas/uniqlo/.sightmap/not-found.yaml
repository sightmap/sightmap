version: 1

views:
  - name: NotFound
    route: /us/en/not-found
    url: https://www.uniqlo.com/us/en/no-such-page-xyz-123
    description: Error page, reached by redirect from any unmatched path.
    memory:
      - The only site in this atlas that gives its error page a real address. An
        unmatched path redirects to `/us/en/not-found`, so `location.pathname`
        alone answers "did I land on an error page" with no DOM inspection at
        all. Every other mapped site keeps the requested path and makes you look
        at the page.
      - The title is descriptive rather than terse ("Our apologies. There has
        been an error. The page you are looking for..."), and the body reads
        "Page not found". Neither string contains the number 404.
      - The full navigation, promo strip, and footer render, and the page also
        carries editorial headings (LifeWear, Sustainability, Inspiration), so a
        check for "does the page have content" passes here.
    components:
      - name: ErrorContent
        selector: '#page-content'
        properties:
          - name: message
            extract: text
        memory:
          - The same content region every route uses. On this view it carries the
            apology plus the standard editorial links, which is why its presence
            proves nothing and its text has to be read.
