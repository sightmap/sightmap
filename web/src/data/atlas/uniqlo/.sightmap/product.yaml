version: 1

views:
  - name: ProductDetail
    route: /us/en/products/:productId/:colorCode
    url: https://www.uniqlo.com/us/en/products/E465185-000/00
    description: Product page — gallery, options, a size comparison table, and related product carousels.
    memory:
      - Loading a product URL appends `?colorDisplayCode=` and
        `?sizeDisplayCode=`, so the address after load differs from the one
        requested even on success. It is not a redirect.
      - Nothing above the gallery and buy controls is purpose-named. Both
        `.fr-ec-layout` and `.gutter-container` are site-wide primitives matching
        dozens of nodes per view, so reach the controls by their own text or role.
      - A recommendation carousel renders here as well, its tiles being
        `.fr-ec-product-tile` inside `.fr-ec-carousel`. On this view
        `.product-tile` matches only the related-products comparison table.
      - The `.product-table` here compares related products. It is not a spec
        table for the product being viewed.
    components:
      - name: ProductTemplate
        selector: '.fr-ec-template-pdp'

      - name: RelatedProducts
        selector: 'section[aria-label="Related Product List"]'
        children:
          - name: ProductTable
            selector: '.product-table'
            properties:
              - name: table_text
                extract: text

    requests:
      - name: ProductVariants
        route: /us/api/commerce/v5/en/products/*/price-groups/*/l2s
        method: GET
        description: The buyable variants — size and colour combinations with their stock. Keyed by the two identifiers that make up this page's URL.
        memory:
          - Both path parameters come straight from the address bar — the product
            id and the price group are the two URL segments — so this call is
            constructible without reading the DOM.

      - name: ProductReviews
        route: /us/api/commerce/v5/en/products/*/reviews
        method: GET
        description: Customer reviews for this product, fetched separately from the product record.

      - name: SizeCharts
        route: /us/api/commerce/v5/en/products/size-charts
        method: GET
        description: Measurement tables for the size guide. Fetched on load rather than when the guide is opened.

      - name: StyleHintPhotos
        route: /us/api/commerce/v5/en/products/*/sh-styles
        method: GET
        description: Customer StyleHint photos featuring this product.

      - name: StyleBookLooks
        route: /us/api/commerce/v5/en/products/*/sb-styles
        method: GET
        description: Styled outfit imagery for this product, a separate collection from the StyleHint photos.

      - name: SimilarProducts
        route: /us/api/commerce/v5/en/products/*/price-groups/*/similar-products
        method: GET
        description: The similar-items strip, keyed by product id and price group like the variants call.

      - name: ProductRecommendations
        route: /us/api/commerce/v5/en/recommendations/products
        method: GET
        description: The recommendation carousel. The listing views call ranked-products instead, so the two surfaces do not share an endpoint.

      - name: CmsWordings
        route: /us/api/commerce/v5/en/cms/wordings
        method: GET
        description: Localized label strings for the product page controls. Only this view fetches them.
