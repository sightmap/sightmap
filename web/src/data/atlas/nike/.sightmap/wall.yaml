version: 1

views:
  - name: SearchResults
    route: /w
    url: https://www.nike.com/w?q=running%20shoes
    description: Keyword search — the product wall with its filter rail and result grid.
    memory:
      - A query that matches a known category redirects to `/w/<categorySlug>`
        and the heading becomes the category name, so read `location.href` after
        the load rather than assuming the search URL held.
      - There is no dedicated result-count element. The total sits in parentheses
        inside the `.wall-header__title` sentence and has to be parsed out.
      - The grid renders 24 cards and appends on scroll, so a count taken on load
        measures the first page, not the total in the heading.
      - The loader overlay is a permanent child of `.product-grid`, not one
        mounted on demand. Presence is not a loading signal; visibility is.
    components:
      - name: BrowseShell
        selector: '[data-test="browseShell"]'

      - name: Wall
        selector: '#Wall'

      - name: WallHeader
        selector: '.wall-header'
        children:
          - name: WallTitle
            selector: '.wall-header__title'
            properties:
              - name: heading
                extract: text

      - name: FilterRail
        selector: '.ln-scroller'
        memory:
          - Filters rewrite the URL, so filter state survives a reload and can be
            composed without clicking.

      - name: ProductGrid
        selector: '.product-grid'
        children:
          - name: GridLoaderOverlay
            selector: '.loader-overlay'

      - name: ProductCard
        selector: '.product-card'
        properties:
          - name: position
            extract: attr=data-product-position
          - name: is_premium
            extract: attr=data-is-premium
        memory:
          - Card position is its rank in the whole result set, not its index
            among the 24 rendered.
        children:
          - name: CardLink
            selector: '.product-card__link-overlay'
            properties:
              - name: product_url
                extract: attr=href
          - name: CardTitle
            selector: '.product-card__title'
            properties:
              - name: title
                extract: text
          - name: CardPrice
            selector: '.product-price'
            properties:
              - name: price
                extract: text
            memory:
              - Discounted cards carry two price elements, current and original,
                so the price count runs ahead of the card count.
          - name: CardImage
            selector: '.product-card__hero-image'

    requests:
      - name: ProductWall
        route: /discover/product_wall/v1/marketplace/*/language/*/consumerChannelId/*
        method: GET
        description: The grid contents on api.nike.com, for everything past the first paint — refining, sorting, and paging further in.
        memory:
          - The first 24 results are already in the served HTML, so a plain fetch
            with no JavaScript gets them. This endpoint takes over only once the
            query changes or the served page runs out.
          - Category browse calls the same endpoint with a taxonomy filter
            instead of a query, and the response shape is identical.
