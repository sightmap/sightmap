version: 1

views:
  - name: CategoryWall
    route: /w/:categorySlug
    url: https://www.nike.com/w/mens-running-shoes-37v7jznik1zy7ok
    description: Category browse — the same product wall as search, addressed by a category slug.
    memory:
      - Structurally identical to `SearchResults`. The distinction is the URL
        shape, not the page, so an agent that handles one handles the other.
      - The slug ends in an opaque taxonomy code (`37v7jznik1zy7ok`) that
        concatenates one or more facet ids. It cannot be constructed from a
        category name; follow a link from the shopping menu instead.
      - Every entry in the global nav's shopping menu points at one of these, so
        the full top-level taxonomy is enumerable from the header without opening
        a flyout.
    components:
      - name: BrowseShell
        selector: '[data-test="browseShell"]'

      - name: Wall
        selector: '#Wall'

      - name: WallHeader
        selector: '.wall-header'
        children:
          - name: WallTitle
            selector: '.wall-header__title'
            properties:
              - name: heading
                extract: text

      - name: FilterRail
        selector: '.ln-scroller'

      - name: ProductGrid
        selector: '.product-grid'
        children:
          - name: GridLoaderOverlay
            selector: '.loader-overlay'

      - name: ProductCard
        selector: '.product-card'
        properties:
          - name: position
            extract: attr=data-product-position
        children:
          - name: CardLink
            selector: '.product-card__link-overlay'
            properties:
              - name: product_url
                extract: attr=href
          - name: CardTitle
            selector: '.product-card__title'
            properties:
              - name: title
                extract: text
          - name: CardPrice
            selector: '.product-price'
            properties:
              - name: price
                extract: text

    requests:
      - name: ProductWall
        route: /discover/product_wall/v1/marketplace/*/language/*/consumerChannelId/*
        method: GET
        description: The grid contents on api.nike.com, for refining and paging past the first screen, which is already in the document. The same endpoint keyword search uses; only the filter differs.

      - name: RelatedLinks
        route: /user_navigation/relatedlinks/v1
        method: GET
        description: The related-category links below the grid. Category browse fetches these and keyword search does not.
