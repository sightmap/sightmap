version: 1

views:
  - name: Home
    route: /us/en
    url: https://www.ikea.com/us/en/
    description: Landing page — category carousel and a stack of CMS-driven promotional modules.
    memory:
      - Every promo module carries two testids and only one is usable. The outer
        one is a CMS entry id (`data-testid="5EPhOkZOk1TdhhrR5us7Yt"`) that
        changes whenever marketing edits the page; the inner one names the
        component type (`hri-bento-container`, `hri-carousel`, `hri-deals`,
        `hri-editorial-shelf`, `hri-product-shelf`). Always match the inner one.
      - The `hri-` prefix belongs to this page, alongside `hnf-` for the frame.
        It does not appear on search, category, or product pages.
      - Which modules render, and in what order, is merchandising. Treat every
        one of them as optional and find it by type rather than by position.
      - Store-specific content ("See what's happening now at IKEA Atlanta, GA")
        is geolocated from the visitor's IP, so this page differs by where the
        request comes from even within one locale.
    components:
      - name: ShoppingLinks
        selector: 'nav[aria-label="Shopping links"]'
        memory:
          - Log in, Favorites, and Shopping bag. The greeting reads "Hej!" when
            signed out, which is easy to mistake for a personalized name.
        children:
          - name: ShoppingIconsList
            selector: '.hnf-navbar__icons-list'

      - name: HomeContent
        selector: '.hri-content-container'

      - name: CategoryCarousel
        selector: '.hnf-pageheader__in-page-nav'
        memory:
          - The same component the category pages use for subcategories. Here it
            lists the top-level departments, which makes it the cheapest way to
            enumerate the catalog roots.

      - name: BentoModule
        selector: '[data-testid="hri-bento-container"]'

      - name: PromoCarousel
        selector: '.hri-carousel'

      - name: DealsModule
        selector: '[data-testid="hri-deals"]'
        memory:
          - Tabbed by offer type, with the tab strip in
            `.hri-pills-menu-carousel-container` and the products in a
            `[role="tabpanel"]`. Only the selected panel holds products, so
            reading the module without switching tabs sees one slice of it.
        children:
          - name: DealsTabs
            selector: '.hri-pills-menu-carousel-container'
          - name: DealsPanel
            selector: '[role="tabpanel"]'

      - name: EditorialShelf
        selector: '[data-testid="hri-editorial-shelf"]'

      - name: ProductShelf
        selector: '#hri-product-shelf'

      - name: StoreModule
        selector: '[data-testid="hri-fragments-store-container"]'
        properties:
          - name: store_text
            extract: text
        memory:
          - Names the nearest store, inferred from the request's IP address
            rather than from anything the visitor chose.

      - name: PromoDisclaimer
        selector: '[data-testid="hri-fragment-disclaimer"]'

    requests:
      - name: ShoppableProductFragment
        route: /us/en/products/*/*-shoppable-fragment.html
        method: GET
        description: One card of markup per product in the home page carousels, fetched individually. Roughly twenty fire on a full scroll.
