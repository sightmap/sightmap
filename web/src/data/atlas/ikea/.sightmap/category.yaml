version: 1

views:
  - name: CategoryBrowse
    route: /us/en/cat/:categorySlug
    url: https://www.ikea.com/us/en/cat/tables-chairs-fu002/
    description: Category page — page header, in-page category carousel, and the shared product grid.
    memory:
      - The slug is decorative and the trailing id is authoritative.
        `/cat/totally-made-up-fu002/` loads Tables & Chairs and rewrites the path
        to `/cat/tables-chairs-fu002/`, so the URL you requested never tells you
        what you got.
      - An unknown id does not 404. `/cat/tables-chairs-zz999/` redirects to
        `/cat/products-products/`, the root of the catalog, which means a typo in
        an id silently widens the query to everything IKEA sells. Read
        `.hnf-pageheader__h1` to find out where you actually landed.
      - The grid is the same `plp-` component set used by search, so anything
        written against `[data-testid="plp-product-card"]` works on both.
    components:
      - name: PageHeader
        selector: '.hnf-pageheader__wrapper'
        children:
          - name: CategoryTitle
            selector: '.hnf-pageheader__h1'
            properties:
              - name: category_name
                extract: text
            memory:
              - The only trustworthy answer to which category loaded, given that
                both the slug and a bad id resolve silently.
          - name: HeaderBreadcrumbs
            selector: '.hnf-pageheader__breadcrumbs'
          - name: SubcategoryNav
            selector: '.hnf-pageheader__in-page-nav'
            memory:
              - A horizontal carousel of child categories.

      - name: SubcategoryItem
        selector: '.hnf-carousel__wrapper a'
        properties:
          - name: tracking_label
            extract: attr=data-tracking-label
        memory:
          - Each entry carries a `data-tracking-label` of the form
            `products | <parentId> | <childId>`, which exposes the taxonomy ids
            without following a single link.
          - Mapped at the top level rather than under `SubcategoryNav`, since
            nesting it three deep only lengthens the selector without narrowing
            what it matches.

      - name: CategoryContent
        selector: '.plp-content-container'

      - name: ProductGrid
        selector: '#product-list'

      - name: ProductCard
        selector: '[data-testid="plp-product-card"]'
        properties:
          - name: card_text
            extract: text
        children:
          - name: CardPrice
            selector: '.plp-grid-product-card__price-wrapper'
            properties:
              - name: price_text
                extract: text

      - name: FilterSidebar
        selector: '[data-testid="plp-filter-side-bar"]'

    requests:
      - name: ShoppableProductFragment
        route: /us/en/products/*/*-shoppable-fragment.html
        method: GET
        description: One card of markup per product in the carousels on this page, fetched individually. Not used by the grid itself, which arrives in the document.
