version: 1

views:
  - name: ProductDetail
    route: /us/en/p/:productSlug
    url: https://www.ikea.com/us/en/p/goersnygg-storage-case-white-clear-40504193/
    description: Product page — gallery, price module, ratings, delivery and stock, and the add-to-cart control.
    memory:
      - The number ending the slug is the article number, and it is the key the
        product APIs use. `40504193` in
        `/p/goersnygg-storage-case-white-clear-40504193/` is the same id that
        appears in the circular-offers and 3D-model requests, so an agent can
        derive API calls from the URL with no lookup.
      - Everything on this page is prefixed `pipf-` except the price, which is
        `pipcom-price-module`. That one inconsistency is worth remembering
        because price is the field most often wanted.
      - Product names are Swedish and rendered with their diacritics
        (GÖRSNYGG). Matching on a name typed without them fails.
      - Delivery and in-store stock render in a lower-funnel section that fills
        in after the main page, so a snapshot taken too early shows the product
        with no availability at all rather than showing it as unavailable.
    components:
      - name: ProductPage
        selector: '.pipf-page'

      - name: ProductGallery
        selector: '.pipf-product-gallery'
        memory:
          - Thumbnails swap the main image in place and never change the URL, so
            which image is showing is not recoverable from the address bar.
        children:
          - name: GalleryThumbnails
            selector: '.pipf-product-gallery__thumbnails'
          - name: GalleryMainImage
            selector: '.pipf-zoom-image'

      - name: PricePackage
        selector: '.pipf-price-package'
        properties:
          - name: package_text
            extract: text
        children:
          - name: PriceModule
            selector: '.pipcom-price-module'
            properties:
              - name: price
                extract: text

      - name: RatingsSummary
        selector: '.js-ugc-container'
        properties:
          - name: rating_text
            extract: text
        memory:
          - Absent on articles with no reviews rather than rendering as zero.

      - name: FulfillmentSection
        selector: '.lower-funnel-fragments-section-group'
        properties:
          - name: fulfillment_text
            extract: text
        memory:
          - Holds "How to get it", price information, and the store picker. It is
            the part of the page that depends on a selected store, so its
            contents change with location while the rest of the page does not.

      - name: AccessoriesGrid
        selector: '.pipf-accessories-grid'
        memory:
          - Accessory suggestions in the complete-the-look style. Present on some
            articles and absent on others.
        children:
          - name: AccessoriesHeader
            selector: '.pipf-accessories-grid__header-wrapper'

      - name: CategoryShortcuts
        selector: '.pipf-category-shortcuts'
        memory:
          - Links back up into the taxonomy, each annotated with a product count
            ("Clothes boxes, 46 products"). Reading these gives an agent the size
            of a category without loading it.

      - name: RecommendationCarousel
        selector: '.crec-fragment'
        memory:
          - Personalized recommendations loaded as a separate fragment with its
            own `crec-` prefix, a fourth vocabulary alongside `hnf-`, `plp-`, and
            `pipf-`. It arrives after the rest of the page and its contents
            change per visit.

      - name: AddToCartSection
        selector: '.js-add-to-cart-section'
        memory:
          - Quantity is a number input paired with stepper buttons, so setting it
            means writing the field rather than clicking up repeatedly.
        children:
          - name: AddToCartButtons
            selector: '.pipf-add-to-cart-section__buttons'

    requests:
      - name: ShoppableProductFragment
        route: /us/en/products/*/*-shoppable-fragment.html
        method: GET
        description: One card of markup per product in the recommendation carousels, fetched individually. A product page issues roughly twenty of them.
        memory:
          - The path buckets by the last three digits of the article number, so
            article 40504193 is served from `/products/193/`. That bucket is
            derivable from the article number and is not a separate id.
          - These arrive as HTML rather than JSON, and they are the reason a
            carousel is empty in a snapshot taken before the page settles.

      - name: ProductRecommendationRail
        route: /us/en/listing/fragments/product-rec/*/
        method: GET
        description: The wrapper markup for one recommendation rail. The path segment names the rail, such as recommended-for-you or recently-viewed.

      - name: CircularOffers
        route: /circular/circular-asis/offers/articles/*
        method: GET
        description: Buy-back and resale offers for one article, on web-api.ikea.com. Conditional — it fires only for articles IKEA will buy back, so many product pages never issue it.

      - name: RoteraModel
        route: /*/rotera/data/model/*
        method: GET
        description: 3D model data for the product viewer, keyed by the article number that ends the product URL. Conditional on the article having a 3D model.
