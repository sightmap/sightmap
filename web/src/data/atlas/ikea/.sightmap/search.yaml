version: 1

views:
  - name: SearchResults
    route: /us/en/search
    url: https://www.ikea.com/us/en/search/?q=desk%20chair
    description: Keyword search — result summary, filter sidebar, and the product grid.
    memory:
      - The page embeds a Cloudflare Turnstile widget as a hidden
        `cf-turnstile-response` input. It stayed dormant across this mapping and
        never presented a challenge, but its presence means search is the route
        most likely to start gating automated traffic.
      - Shares the whole `plp-` component vocabulary with category browse. Anything
        written against the grid here works unchanged on a `/cat/` page, which
        makes these two views one problem rather than two.
      - Sort is a set of radio inputs with stable ids (`#plp-RELEVANCE`,
        `#plp-PRICE_LOW_TO_HIGH`, `#plp-PRICE_HIGH_TO_LOW`, `#plp-NEWEST`) whose
        shared `name` is generated (`sort-P0-0`). Target the ids, not the name.
      - The only content route that fetches nothing of its own. Home, category
        browse, and product pages each pull about twenty per-product HTML
        fragments to fill their carousels; search has no carousels and issues
        none, so everything here is either already in the document or appended
        by the grid's own scroll handler.
    components:
      - name: SearchPage
        selector: '[data-testid="plp-search-page-container"]'

      - name: SearchSummary
        selector: '.search-summary'
        properties:
          - name: summary
            extract: text
        memory:
          - Carries the authoritative result count ("50 items for \"desk
            chair\""), which is the number to trust over anything derived from
            the DOM.
        children:
          - name: KnowledgeBox
            selector: '[data-testid="plp-knowledge-box"]'
            memory:
              - A contextual promo ("Design your own office space") shown for
                some queries and not others.

      - name: FilterSidebar
        selector: '[data-testid="plp-filter-side-bar"]'
        memory:
          - Filters are accordion sections. Applying one rewrites the query
            string, so filter state survives a reload and can be composed by URL.

      - name: ProductGrid
        selector: '#product-list'

      - name: ProductCard
        selector: '[data-testid="plp-product-card"]'
        properties:
          - name: card_text
            extract: text
        memory:
          - The same card component appears on category pages. Its price,
            availability, and variant blocks are each optional, so branch on
            presence rather than assuming a fixed shape.
        children:
          - name: CardImage
            selector: '.plp-grid-product-card__image-container'
          - name: CardPrice
            selector: '.plp-grid-product-card__price-wrapper'
            properties:
              - name: price_text
                extract: text
          - name: CardVariants
            selector: '.plp-product-variants'
            memory:
              - Present only when the article ships in more than one color or
                size. "More options" links to the sibling articles.
          - name: CardAvailability
            selector: '.plp-availability--container'
            properties:
              - name: availability
                extract: text

      - name: BreakoutCard
        selector: '[data-testid="plp-breakout-card"]'
        memory:
          - A promotional tile placed inside the product grid. It has no price
            and no article number, so a walk over grid children that assumes
            every tile is a product will trip on it.
