version: 1

memory:
  - Three class prefixes divide the site and each belongs to a different team's
    surface. `globalnav-` and `as-globalfooter-` are the shared chrome,
    `rf-serp-` is search, and `rf-bfe-` is the buy flow (retail's configure and
    purchase experience). A `rc-` prefix appears inside the buy flow for pricing
    and option controls.
  - Marketing pages and store pages are different systems sharing one header. A
    URL like `/macbook-air/` is an editorial page with no way to buy; the
    purchase surface is `/shop/buy-mac/macbook-air`. Confusing the two is the
    easiest mistake to make on this site.
  - There is a permalink layer at `/us/shop/goto/`. Those paths use underscores
    and redirect to the hyphenated canonical route, so
    `/us/shop/goto/buy_mac/macbook_air` lands on `/shop/buy-mac/macbook-air`.
    The home page alone carries over a hundred of these links, which means most
    store URLs an agent finds by crawling are aliases rather than destinations.
  - React `useId` output appears as ids like `#_r_3_` and `#panel-_r_3_-0`. They
    change per render and are not valid CSS identifiers unescaped.
  - The first path segment is a locale code, and this changes the language of
    everything including errors. `/fr/nope-xyz` returns the not-found page in
    French ("Page introuvable"), `/no/...` returns it in Norwegian, and a segment
    that is not a country code (`/zzz/...`) returns English. An agent that
    detects errors by matching the message text gets a different string depending
    on a path segment it may not have chosen deliberately.
  - The footer states that Apple approximates the visitor's location from their
    internet connection, and delivery estimates in the buy flow follow from it,
    so fulfillment text differs by where the request originates.

components:
  - name: GlobalHeader
    selector: '#globalheader'
    memory:
      - Identical on every route including the 404, and it contributes over 230
        links to any node count because the full store menu is in the DOM whether
        or not a flyout is open.
    children:
      - name: GlobalNav
        selector: '#globalnav'
      - name: GlobalNavList
        selector: '#globalnav-list'

  - name: NavCurtain
    selector: '#globalnav-curtain'
    memory:
      - A full-viewport overlay that exists on every route and only becomes
        visible when a nav flyout opens. Its presence is not a signal that a menu
        is showing.

  - name: PageRoot
    selector: '#page'
    memory:
      - Present on search and store routes only. Marketing pages and the landing
        page have no equivalent wrapper.

  - name: MainRegion
    selector: '[role="main"]'
    memory:
      - The one content landmark present on every route. The `#main` id exists on
        marketing pages and the error page but not on the landing page, so the
        role is the portable hook.

  - name: AnnouncementPortal
    selector: '#portal'
    memory:
      - A portal holding the accessibility live regions. Each announcement is a
        `role="status"` element whose id is React `useId` output
        (`#announce-message-_r_8_`), so the individual regions cannot be
        addressed but the portal that contains them can. There were nine of them
        on the buy flow, all empty until something changes.

  - name: NavSearchResultCount
    selector: '.globalnav-searchresults-count'
    memory:
      - A polite live region announcing how many suggestions the header search
        returned. Empty until the field is used.

  - name: GlobalFooter
    selector: '#ac-globalfooter, #global-footersection'
    memory:
      - Two different ids for the same footer depending on page type.
        Marketing pages and the landing page use `#ac-globalfooter`; search and
        the store use `#global-footersection`. Matching only one finds the footer
        on roughly half the site.
    children:
      - name: FooterDisclosure
        selector: '.as-globalfooter-sosumi'
        properties:
          - name: disclosure
            extract: text
        memory:
          - Legal footnotes, including the location-approximation notice. Apple
            calls this block "sosumi" in its own class names.
      - name: FooterBreadcrumbs
        selector: 'nav[aria-label="Breadcrumbs"]'
        properties:
          - name: trail
            extract: text
        memory:
          - Breadcrumbs live in the footer on this site, not above the content.
      - name: FooterDirectory
        selector: 'nav[aria-label="More Apple Store Links"]'

requests:
  - name: SearchPage
    route: /us/search/*
    method: GET
    description: Search results, served as a document with the query in the path rather than a parameter.
