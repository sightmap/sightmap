version: 1

views:
  - name: BuyFlow
    route: /shop/buy-mac/:model
    url: https://www.apple.com/shop/buy-mac/macbook-air
    description: Configure-and-buy page — stepped option selection with a running price in a sticky bar.
    memory:
      - This is the purchase surface. The marketing page at `/macbook-air/` looks
        like a product page and has no way to buy anything, so an agent that
        lands there and looks for an add-to-cart control will not find one.
      - Options are ordered steps (`.rf-bfe-step`) rather than a flat set of
        fields — size, then chip, then memory and storage. Later steps depend on
        earlier ones, so the configuration cannot be filled in arbitrary order.
      - The sticky bar carries the running total and updates as options change,
        which makes `.rf-bfe-header-price` the live price and `.rc-price` inside
        the header the starting price. The two differ once anything is selected.
      - Delivery estimates in the sticky bar come from the IP-inferred location
        described in the footer disclosure.
    components:
      - name: BuyExperience
        selector: '.rf-bfe'

      - name: StickyBar
        selector: '.rf-bfe-stickybar'
        memory:
          - Rendered above the viewport until the page scrolls, so its bounding
            box has a negative top on load.
        children:
          - name: StickyPrice
            selector: '.rf-bfe-header-price'
            properties:
              - name: running_price
                extract: text
          - name: FulfillmentOptions
            selector: '.rf-bfe-stickybar-fulfillment'
            properties:
              - name: fulfillment
                extract: text

      - name: BuyHeader
        selector: '.rf-bfe-header-wrapper'
        children:
          - name: StartingPrice
            selector: '.rc-prices'
            properties:
              - name: starting_price
                extract: text
          - name: TradeInLink
            selector: '.rf-bfe-header-learnmorelink'

      - name: SelectionArea
        selector: '.rf-bfe-selectionarea'
        children:
          - name: ConfigStep
            selector: '.rf-bfe-step'
            properties:
              - name: step_text
                extract: text
            memory:
              - One per decision. The heading states the question ("Model. Choose
                your size.") and the options follow.
          - name: DimensionChooser
            selector: '.rc-dimension'
          - name: ColorChooser
            selector: '.colornav'
            properties:
              - name: colors
                extract: text
          - name: DecisionSupport
            selector: '.rf-bfe-decision-support'
            memory:
              - Inline help offering a comparison when a step is ambiguous.

      - name: CustomizableSpecs
        selector: '#customizableSpecs'
        properties:
          - name: specs_text
            extract: text
        children:
          - name: ConfigureCard
            selector: '.re-configure-card'

      - name: TradeInSection
        selector: '.rf-bfe-tradeup-header'

      - name: PromoRibbon
        selector: '.ribbon'
        properties:
          - name: promo
            extract: text
        memory:
          - A promotional strip above the buy flow. Its copy rotates, so it is
            not a fixed string.
