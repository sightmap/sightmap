version: 1

views:
  - name: NotFound
    route: /**
    url: https://www.apple.com/zzz/such/page-xyz-123
    description: Catch-all page — an apology, a search box, and a link to the sitemap.
    memory:
      - Keeps the requested path rather than redirecting, so the URL gives no
        signal. The title and the `#main` contents are what identify it.
      - A single-segment unknown path such as `/no-such-page` is
        indistinguishable from a product marketing URL by route shape alone,
        since marketing pages live at `/:productSlug`. The structural tell is
        `#ac-localnav`, which every marketing page has and this page does not.
      - The message language follows the first path segment. `/fr/nope` returns
        "Page introuvable", `/no/nope` returns Norwegian. Match on the absence of
        `#ac-localnav` rather than on the wording.
      - The English heading reads "The page you're looking for can't be found."
        with no error code, so matching on the string 404 fails in every
        language.
      - The full header and footer render and the page carries over 300 visible
        links, almost all of them navigation, so a check for "does this page have
        content" passes easily.
      - It offers two recovery paths, a search box and a sitemap link, which is
        more than most error pages in this atlas provide.
    components:
      - name: ErrorMain
        selector: '#main'
        children:
          - name: ErrorHeadline
            selector: '.section-headline'
            properties:
              - name: message
                extract: text
          - name: ErrorSearch
            selector: '#search-wrapper'
            memory:
              - A working search box, distinct from the header search.
          - name: SitemapLink
            selector: '.cta-sitemap'
