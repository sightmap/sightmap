version: 1

requests:
  - name: Pathfinder
    route: https://api-partner.spotify.com/pathfinder/v2/query
    method: POST
    description: The data API behind every view. One URL serves album, artist, playlist, search and home; the operation is named in the request body, so the URL alone cannot tell you which view fetched it.

  - name: CollectionContains
    route: https://spclient.wg.spotify.com/collection/v2/contains
    method: POST
    description: Asks which of the items on screen are already in the account's library, which is what fills in the saved state of every save control.

  - name: Telemetry
    route: https://gue1-spclient.spotify.com/gabo-receiver-service/v3/events
    method: POST
    description: Client event stream, fired continuously on every route.

  - name: AnalyticsCollect
    route: https://www.google-analytics.com/g/collect
    method: POST
    description: Analytics beacon. Its query string carries account facts including a user id and premium status, so it is a route to recognise and never a payload to read.

components:
  - name: GlobalNav
    selector: '[data-testid="global-nav-bar"]'
    description: Left rail — home, search, and the account menu entry point.
    memory:
      - The account menu lives here, not in the top bar, which is the opposite
        of where the visual layout puts it. Scope it to the nav.
    children:
      - name: HomeButton
        selector: '[data-testid="home-button"]'
      - name: SearchForm
        selector: 'form[role="search"]'
        children:
          - name: SearchField
            selector: 'textarea, input[data-testid="search-input"]'
            properties:
              - name: query_placeholder
                extract: attr=aria-label
      - name: UserWidget
        selector: '[data-testid="user-widget-link"]'
        description: Account menu entry point.

  - name: LibraryGrid
    selector: 'div[role="grid"][aria-label="Your Library"]'
    description: The signed-in library. Structure only — its rows are account contents.
    memory:
      - This grid is a root-level sibling of the nav rail, not a descendant of
        it, so scoping it under the nav matches nothing.

  - name: TopBar
    selector: '[data-testid="topbar"]'
    description: Page-level bar above the content area.

  - name: NowPlayingBar
    selector: '[data-testid="now-playing-bar"]'
    description: Playback chrome, present on every route except the 404.
    memory:
      - This bar owns every `[data-testid="cover-art-image"]` on the page. An
        agent reaching for a page's artwork lands here and gets the playing
        track instead, so scope artwork queries inside the page's own container.
      - It also owns `[data-testid="track"]`, which is an icon in its cover-art
        button and never a track anywhere on the site. The name is a trap.
    children:
      - name: PlayerControls
        selector: '[data-testid="player-controls"]'
        children:
          - name: PlayPauseButton
            selector: '[data-testid="control-button-playpause"]'
          - name: SkipBackButton
            selector: '[data-testid="control-button-skip-back"]'
          - name: SkipForwardButton
            selector: '[data-testid="control-button-skip-forward"]'
      - name: PlaybackProgress
        selector: '[data-testid="playback-progressbar"]'
