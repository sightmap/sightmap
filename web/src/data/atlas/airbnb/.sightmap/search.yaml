version: 1

views:
  - name: SearchResults
    route: /s/:location/homes
    url: https://www.airbnb.com/s/Paris--France/homes
    description: Stay search — a grid of listing cards beside a live map.
    memory:
      - The location segment is a display string with a double hyphen for a
        separator (`Paris--France`), not a slug and not an id. Only `/homes`
        keeps this shape; the other verticals under `/s/` normalize away.
      - Cards and map markers are separate DOM trees for the same listings, and
        neither count is the number of results — the map renders only the
        markers inside the current viewport.
      - The `listing-card-subtitle` hook matches about twice per card. Use
        `listing-card-title` or `listing-card-name` when you need one node per
        card.
    components:
      - name: PageHeading
        selector: '[data-testid="stays-page-heading"]'
        properties:
          - name: heading
            extract: text

      - name: ListingCard
        selector: '[data-testid="card-container"]'
        properties:
          - name: card_text
            extract: text
        children:
          - name: CardTitle
            selector: '[data-testid="listing-card-title"]'
            properties:
              - name: title
                extract: text
          - name: CardName
            selector: '[data-testid="listing-card-name"]'
            properties:
              - name: name
                extract: text
          - name: CardSubtitle
            selector: '[data-testid="listing-card-subtitle"]'
          - name: CardImage
            selector: '[data-testid="listing-image"]'
          - name: CardSaveButton
            selector: '[data-testid="listing-card-save-button"]'
          - name: CardPriceRow
            selector: '[data-testid="price-availability-row"]'
            properties:
              - name: price
                extract: text

      - name: ResultsMap
        selector: '[data-testid="universal-map-controlled"]'
        children:
          - name: MapCanvas
            selector: '[data-testid="map/GoogleMap"]'
          - name: MapMarker
            selector: '[data-testid="map/markers/BasePillMarker"]'
            properties:
              - name: marker_label
                extract: text
          - name: MapZoomIn
            selector: '[data-testid="map/ZoomInButton"]'
          - name: MapZoomOut
            selector: '[data-testid="map/ZoomOutButton"]'
          - name: MapSettings
            selector: '[data-testid="map/settingsButton"]'

    requests:
      - name: LocationContextPlaces
        route: /api/v3/LocationContextPlacesQuery/*
        method: POST
        description: Resolves the searched destination to a place, which is how the normalized path is decided.

      - name: PlaceListingPolygon
        route: /api/v3/PlaceListingPolygonQuery/*
        method: GET
        description: The boundary drawn on the results map for the searched area.

      - name: MapViewportInfo
        route: /api/v3/MapViewportInfoQuery/*
        method: GET
        description: Viewport bounds for the results map. The listing page fetches this too, since both views carry a map.
