version: 1

views:
  - name: ListingDetail
    route: /rooms/:listingId
    url: https://www.airbnb.com/rooms/1731899995599689412
    description: A single stay — hero, overview, amenities, reviews, location, and the booking panel.
    memory:
      - Page structure comes from `data-section-id`, not from `data-testid`. The
        sections are TITLE, HERO, OVERVIEW, BYLINE, HIGHLIGHTS, DESCRIPTION,
        AMENITIES, LOCATION, REVIEWS, POLICIES, and BOOK_IT. An agent reading
        only testids gets the buttons and none of the outline.
      - Section ids carry a variant suffix — `OVERVIEW_DEFAULT_V2` alongside
        `TITLE_DEFAULT` — so the site is running experiments on this page and the
        exact id changes with the variant served. Match on the prefix
        (`[data-section-id^="OVERVIEW"]`) rather than the whole string.
      - Which sections render depends on the property. The listing mapped here is
        a hotel and carries `PROPERTY_AVAILABLE_ROOMS`, which a whole-home
        listing does not have. Treat every section as optional.
      - Listing ids are long integers and the page is public, but the content
        includes host names and guest reviews. This map records structure only.
    components:
      - name: PageShell
        selector: '[data-testid="pageshell-container"]'

      - name: TitleSection
        selector: '[data-section-id="TITLE_DEFAULT"]'
        properties:
          - name: title
            extract: text

      - name: HeroSection
        selector: '[data-section-id="HERO_DEFAULT"]'
        memory:
          - The photo grid. Opening it swaps to a gallery view without leaving
            the route.

      - name: OverviewSection
        selector: '[data-section-id^="OVERVIEW"]'
        properties:
          - name: overview
            extract: text
        memory:
          - Prefix-matched because this section is the one carrying a `_V2`
            variant suffix.

      - name: HighlightsSection
        selector: '[data-section-id="HIGHLIGHTS_DEFAULT"]'

      - name: DescriptionSection
        selector: '[data-section-id="DESCRIPTION_DEFAULT"]'
        properties:
          - name: description
            extract: text

      - name: AmenitiesSection
        selector: '[data-section-id="AMENITIES_DEFAULT"]'
        properties:
          - name: amenities
            extract: text

      - name: LocationSection
        selector: '[data-section-id="LOCATION_DEFAULT"]'
        memory:
          - Shows an approximate area rather than an exact address until a stay
            is booked.

      - name: ReviewsSection
        selector: '[data-section-id="REVIEWS_DEFAULT"]'
        children:
          - name: ShowAllReviewsButton
            selector: '[data-testid="pdp-show-all-reviews-button"]'
            memory:
              - Only a few reviews render inline; the rest are behind this button
                in a modal.

      - name: PoliciesSection
        selector: '[data-section-id="POLICIES_DEFAULT"]'

      - name: BookingPanel
        selector: '[data-section-id="BOOK_IT_SIDEBAR"]'
        children:
          - name: BookItPanel
            selector: '[data-testid="book-it-default"]'
          - name: CheckInDate
            selector: '[data-testid="change-dates-checkIn"]'
            properties:
              - name: check_in
                extract: text
          - name: CheckOutDate
            selector: '[data-testid="change-dates-checkOut"]'
            properties:
              - name: check_out
                extract: text
          - name: ReserveButton
            selector: '[data-testid="homes-pdp-cta-btn"]'
            memory:
              - The reserve action. Activating it starts a real booking flow, so
                it is mapped and not exercised.

      - name: SaveButton
        selector: '[data-testid="pdp-save-button-unsaved"]'
        memory:
          - The testid encodes state — it becomes the saved variant once
            toggled — so a selector for the unsaved form stops matching after a
            save.

      - name: ReportListingButton
        selector: '[data-testid="user-flag-report-button"]'

      - name: SeoLinks
        selector: '[data-section-id="SEO_LINKS_DEFAULT"]'
        memory:
          - Related searches at the foot of the page, useful for enumerating
            nearby areas without running a search.
