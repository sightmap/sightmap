version: 1

views:
  - name: Home
    route: /
    url: https://www.airbnb.com/
    description: Landing page — the expanded search form above destination inspiration.
    memory:
      - The header search here is the expanded `structured-search-input-*` form,
        not the collapsed `little-search` control used on every other route. An
        agent that learned the search markup on a results page does not find it
        here.
      - The vertical tabs (Homes, Experiences, Services) sit in
        `tab-list-wrapper` and change which search the form runs, so the tab has
        to be set before the query rather than after.
      - There are no listing cards on this page. The first surface that lists
        stays is `/s/:location/homes` or a `/:citySlug/stays` landing page.
    components:
      - name: SearchForm
        selector: '[data-testid="structured-search-input-field-query"]'
        properties:
          - name: query
            extract: text
        memory:
          - The destination field. Typing here opens a suggestion panel rather
            than submitting.

      - name: SearchSubmit
        selector: '[data-testid="structured-search-input-search-button"]'

      - name: SearchIcon
        selector: '[data-testid="little-search-icon"]'
