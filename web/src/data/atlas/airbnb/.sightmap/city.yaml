version: 1

views:
  - name: CityLanding
    route: /:citySlug/stays
    url: https://www.airbnb.com/paris-france/stays
    description: SEO landing page for a destination — carousels of listing cards and cross-links.
    memory:
      - Section testids on this page type are UPPER_SNAKE (`LISTINGS_CAROUSEL`,
        `HEADER`, `BANNER`, `TABBED_CROSS_LINKS`), which is a different
        convention from the kebab-case component testids used on search. Same
        attribute, different vocabulary, on the same site.
      - It renders listing cards using the same `listing-card-*` components as
        search, so card selectors carry over even though the page around them
        does not.
      - There is no map and no filter rail here. This is a marketing surface,
        and the route to filtered results is `/s/:location/homes`.
      - The quietest route on the site by a wide margin. It issues one GraphQL
        call, for consent flags, where search issues nine and a listing page
        eleven — no header call, no client configs, no announcements. Everything
        it shows is already in the document, which makes it the cheapest surface
        to read and the one most likely to survive a slow connection.
    components:
      - name: CityHeader
        selector: '[data-testid="HEADER"]'
        properties:
          - name: heading
            extract: text

      - name: CityBanner
        selector: '[data-testid="BANNER"]'

      - name: ListingsCarousel
        selector: '[data-testid="LISTINGS_CAROUSEL"]'
        memory:
          - Several per page, one per theme. Each holds the same listing cards
            search uses.
        children:
          - name: CardTitle
            selector: '[data-testid="listing-card-title"]'
            properties:
              - name: title
                extract: text
          - name: CardName
            selector: '[data-testid="listing-card-name"]'
            properties:
              - name: name
                extract: text

      - name: CrossLinks
        selector: '[data-testid="TABBED_CROSS_LINKS"]'
        memory:
          - Tabbed links to neighbouring destinations and property types. The
            cheapest way to enumerate related city slugs.
