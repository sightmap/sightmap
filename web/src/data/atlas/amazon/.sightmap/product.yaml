version: 1

views:
  - name: ProductDetail
    route: /dp/:asin
    url: https://www.amazon.com/dp/B08L5NP6NG
    description: Product page — title, image block, price, buy box, and the feature-slot body.
    memory:
      - The page is assembled from slots whose ids end `_feature_div`. There were
        541 of them on the article mapped here and 501 rendered empty, so the
        overwhelming majority of the ids on this page match an element that shows
        nothing. Presence of a slot means the template reserved it, not that it
        has content.
      - Ids are duplicated, and this is the trap most likely to break an agent.
        Amazon renders more than one buy-box variant and hides all but one, so
        `#add-to-cart-button` and `#buy-now-button` each match twice and
        `#availability` matches three times. Every duplicate observed here sits
        inside `#buybox`, and the hidden ones measure 0x0. Filter by visibility
        rather than trusting `querySelector`.
      - The ASIN in the path is the whole address. `/dp/:asin` with no other
        segments or query serves the same page, and it is the id search results
        already carry.
      - The three-column layout (`#leftCol` images, `#centerCol` facts,
        `#rightCol` buy box) is stable across article types even as the feature
        slots inside them change completely.
    components:
      - name: ProductRoot
        selector: '#dp-container'

      - name: ImageColumn
        selector: '#leftCol'
        children:
          - name: ImageBlock
            selector: '#imageBlock'
            memory:
              - Thumbnails swap the main image in place without touching the URL.

      - name: CenterColumn
        selector: '#centerCol'
        children:
          - name: ProductTitle
            selector: '#productTitle'
            properties:
              - name: title
                extract: text
          - name: BylineInfo
            selector: '#bylineInfo'
            properties:
              - name: brand
                extract: text
            memory:
              - Links to the brand's store. Absent on articles with no brand
                association.
          - name: ReviewSummary
            selector: '#averageCustomerReviews'
            properties:
              - name: rating
                extract: text
          - name: CorePrice
            selector: '#corePrice_feature_div'
            properties:
              - name: price
                extract: text
            memory:
              - The price shown in the center column. The buy box carries its own
                copy, and on articles with multiple offers the two can differ,
                since the buy box reflects the selected offer.

      - name: BuyBox
        selector: '#buybox'
        memory:
          - Holds every duplicate id on the page. Scope to the visible descendant
            rather than matching the ids globally.
        children:
          - name: Availability
            selector: '#availability'
            properties:
              - name: availability
                extract: text
            memory:
              - Three of these exist inside the buy box and two are hidden.
          - name: AddToCartButton
            selector: '#add-to-cart-button'
            memory:
              - Two of these exist, one visible and one 0x0.
          - name: BuyNowButton
            selector: '#buy-now-button'
            memory:
              - Two of these exist, one visible and one 0x0.

      - name: RightColumn
        selector: '#rightCol'

      - name: SentinelDivs
        selector: 'body > div:not(#a-page)'
        properties:
          - name: sentinel_id
            extract: attr=id
        memory:
          - Fourteen one-pixel divs sit after the page root as siblings of it,
            each holding nothing. They are placeholders that scripts fill in
            later, and they inflate any count of body-level structure.
          - One of them is `#add-to-cart-btn`, a third id in the add-to-cart
            family alongside the two `#add-to-cart-button` elements in the buy
            box. It is an empty placeholder and not a control.

      - name: FeatureSlot
        selector: '[id$="_feature_div"]'
        properties:
          - name: slot_id
            extract: attr=id
        memory:
          - Mapped as one component because there are hundreds and their names
            are per-article. `slot_id` tells you which slot you are looking at;
            most of them are empty on any given page.

    requests:
      - name: CartItems
        route: /cart/add-to-cart/get-cart-items
        method: GET
        description: Cart contents for the add-to-cart panel. Fires only where an add-to-cart control exists, which is this view and search.

      - name: AddToCartTemplate
        route: /cart/add-to-cart/patc-template
        method: GET
        description: Markup for the panel that slides in after an item is added. Fetched up front, before anything is added.

      - name: ReviewsLazyStream
        route: /portal/customer-reviews/ajax/lazy-widgets/stream
        method: POST
        description: Fills out the review section below the fold once it is scrolled toward.
        memory:
          - Eight reviews are already in the document, so the section is not
            empty before this resolves — it is short. Counting what is on the
            page is therefore not a count of the product's reviews; the total is
            in the rating summary near the title.
