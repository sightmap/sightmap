version: 1

views:
  - name: SearchResults
    route: /s
    url: https://www.amazon.com/s?k=cordless+drill
    description: Keyword search — refinement rail, result grid, and pagination.
    memory:
      - Result cards are `[data-component-type="s-search-result"]`. Do not reach
        for `[data-asin]` — carousels, ad slots, and recommendation strips carry
        an ASIN too, and they look exactly like results until you follow them.
      - A card's `data-asin` is the id that forms its product URL at `/dp/:asin`,
        so results link through with no lookup.
      - The count in the info bar is Amazon's estimate of total matches, not the
        number of cards rendered.
    components:
      - name: SearchRoot
        selector: '#search'

      - name: RefinementRail
        selector: '#s-refinements'
        memory:
          - Filters are links that rewrite the query string, so filter state
            survives a reload and can be composed by URL without clicking.

      - name: ResultInfoBar
        selector: '[data-component-type="s-result-info-bar"]'
        properties:
          - name: result_summary
            extract: text

      - name: SearchResultCard
        selector: '[data-component-type="s-search-result"]'
        properties:
          - name: asin
            extract: attr=data-asin
          - name: position
            extract: attr=data-index
        children:
          - name: CardTitle
            selector: '[data-cy="title-recipe"]'
            properties:
              - name: title
                extract: text
          - name: CardPrice
            selector: '[data-cy="price-recipe"]'
            properties:
              - name: price
                extract: text
          - name: CardReviews
            selector: '[data-cy="reviews-block"]'
            properties:
              - name: reviews
                extract: text
          - name: CardDelivery
            selector: '[data-cy="delivery-recipe"]'
            properties:
              - name: delivery
                extract: text

      - name: Pagination
        selector: '.s-pagination-container'

      - name: WidgetContainer
        selector: '.s-widget-container'

    requests:
      - name: CartItems
        route: /cart/add-to-cart/get-cart-items
        method: GET
        description: Cart contents for the add-to-cart panel. Fires only where an add-to-cart control exists, which is this view and the product page.

      - name: AddToCartTemplate
        route: /cart/add-to-cart/patc-template
        method: GET
        description: Markup for the panel that slides in after an item is added. Fetched up front, before anything is added.

      - name: AddToCartConfig
        route: /cart/add-to-cart/patc-config
        method: GET
        description: Configuration for the add-to-cart panel. Search fetches this alongside the template; the product page does not.
