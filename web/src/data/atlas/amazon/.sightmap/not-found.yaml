version: 1

views:
  - name: NotFound
    route: /**
    url: https://www.amazon.com/no-such-page-xyz-123
    description: Catch-all error page — a hand-minified document with no text nodes and a search box for recovery.
    memory:
      - The page has no text. `document.body.innerText` is the empty string,
        because the apology ("Sorry! We couldn't find that page") is the `alt`
        attribute of an image. An agent that detects errors by reading page copy
        finds nothing here and is likely to conclude the page never finished
        loading.
      - The signals that work are `document.title === "Page Not Found"`, the
        absence of the site chrome, and the `alt` text on the images.
      - It does not use the site template. `#navbar`, `#a-page`, and the whole
        `nav-` vocabulary are absent, which makes their absence the most reliable
        structural check on the site.
      - The markup is hand-minified with single-letter ids — the form is `#a`,
        the search field is `#e`, the submit is `#f`. Nothing else on the site
        looks like this, so these hooks are unique to the error page and worth
        matching by `name` where possible.
      - The recovery form posts to `/s` using `field-keywords` rather than the
        `k` parameter the header search uses. Both reach search.
      - Amazon serves a rotating staff-dog photo here, so the images differ
        between loads while the structure does not.
    components:
      - name: ErrorImages
        selector: img
        properties:
          - name: alt_text
            extract: attr=alt
        memory:
          - The only carrier of meaning on the page. Read `alt_text` to recover
            the error message.

      - name: RecoverySearchForm
        selector: 'form[role="search"]'
        memory:
          - The one way forward from this page without going back to the root.
          - Matched on `role` rather than on `action="/s"`. Both find the form in
            a live browser, but `sightmap sel-probe` reports that the offline
            matcher sees zero matches for the `action` form, and the offline
            matcher is what `snapshot`, `coverage`, and `capture` use.
        children:
          - name: RecoverySearchInput
            selector: 'input[name="field-keywords"]'
            properties:
              - name: query
                extract: attr=value
          - name: RecoverySearchSubmit
            selector: 'input[type="submit"]'

      - name: ErrorLinks
        selector: a
        properties:
          - name: href
            extract: attr=href
        memory:
          - Three links, all with empty text because their content is an image.
            Two point at the root and one at `/dogsofamazon`.
