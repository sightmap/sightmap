version: 1
views:
  - name: Office
    route: /
    components:
      - name: ContactName
        selector: '[data-component="ContactName"]'
      - name: SaveContact
        selector: '[data-component="SaveContact"]'
      - name: ContactResult
        selector: '[data-component="ContactResult"]'
      - name: DirectoryFilter
        selector: '[data-component="DirectoryFilter"]'
      - name: SelectPerson
        selector: '[data-component="SelectPerson"]'
        properties:
          - name: person
            extract: attr=data-person
      - name: SelectionResult
        selector: '[data-component="SelectionResult"]'
      - name: ReportLink
        selector: '[data-component="ReportLink"]'
      - name: ReportValue
        selector: '[data-component="ReportValue"]'
