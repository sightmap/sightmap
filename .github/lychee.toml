# Link checker config — run by the docs workflow after a clean build.
# Internal links failing is a hard error; external links are informational.

cache = true
max_cache_age = "7d"
verbose = "info"
no_progress = true
include_verbatim = true
include_fragments = true

# Exclude patterns for hosts that legitimately can't be reached from CI:
#   - localhost / 127.0.0.1: dev URLs in code samples
#   - docs.sightmap.org: self-references; the deploy is what's being checked
#   - sightmap.org: marketing site is currently password-gated (returns 401)
#   - github.com/sightmap: org repos are still private pre-launch (return 404
#     unauthenticated). Remove this exclusion once the repos go public.
exclude = [
  "^http://localhost",
  "^http://127\\.0\\.0\\.1",
  "^https://docs\\.sightmap\\.org",
  "^https://sightmap\\.org",
  "^https://github\\.com/sightmap",
  "^https://raw\\.githubusercontent\\.com/sightmap",
  # npmjs.com bot-blocks lychee with 403; package URLs are stable
  "^https://www\\.npmjs\\.com",
]
