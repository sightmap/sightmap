name: go

on:
  push:
    branches: [main]
    paths: ['go/**', 'skills/**', '.github/workflows/go.yml']
  pull_request:
    paths: ['go/**', 'skills/**', '.github/workflows/go.yml']

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.2'
          cache-dependency-path: go/go.sum

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi

      # The embedded skills (go/skills/<name>/) are generated from the canonical
      # corpora at the repo root (skills/). Regenerate and fail on any drift so
      # the two never diverge. Edit skills/<name>/, not the go/skills copy.
      - name: skills embed in sync
        run: |
          go generate ./skills/...
          if [ -n "$(git -C .. status --porcelain -- skills go/skills)" ]; then
            echo "Embedded skills are out of sync with the canonical skills/ directory."
            echo "Run 'go generate ./skills/...' from go/ and commit the result."
            git -C .. status --porcelain -- skills go/skills
            git -C .. --no-pager diff -- skills go/skills
            exit 1
          fi

      - run: go build ./...

      - run: go test ./...

  js:
    # The browser-side JS embedded into the Go binary (go/**/*.js) has jsdom
    # tests, but nothing ran them until now — which is how a matcher bug that
    # discarded 48% of a corpus shipped. Path-filtered with the rest of go/**.
    name: embedded js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # The extension's matching core lives in resolver.js. content.js carries a
      # GENERATED copy of it, because an MV3 declarative content script runs as a
      # classic script and cannot import an ES module. Fail on drift rather than
      # let one fix land in only one of the two copies.
      - name: extension resolver copy in sync
        run: node scripts/sync-extension-resolver.mjs --check

      - run: npm run fmt:check

      - run: npm test
