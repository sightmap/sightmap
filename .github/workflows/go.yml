name: go

on:
  push:
    branches: [main]
    paths: ['go/**', 'skills/**', 'webmcp/**', '.github/workflows/go.yml']
  pull_request:
    paths: ['go/**', 'skills/**', 'webmcp/**', '.github/workflows/go.yml']

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.2'
          cache-dependency-path: go/go.sum

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi

      # The embedded skills (go/skills/<name>/) are generated from the canonical
      # corpora at the repo root (skills/). Regenerate and fail on any drift so
      # the two never diverge. Edit skills/<name>/, not the go/skills copy.
      - name: skills embed in sync
        run: |
          go generate ./skills/...
          if [ -n "$(git -C .. status --porcelain -- skills go/skills)" ]; then
            echo "Embedded skills are out of sync with the canonical skills/ directory."
            echo "Run 'go generate ./skills/...' from go/ and commit the result."
            git -C .. status --porcelain -- skills go/skills
            git -C .. --no-pager diff -- skills go/skills
            exit 1
          fi

      # The webmcp package embeds the browser runtime from the canonical
      # source at <repo>/webmcp/src/runtime/runtime.js (plus the generator
      # version from webmcp/package.json). Regenerate and fail on drift, the
      # same contract as the skills embed above. The package's golden tests
      # then byte-compare Go-generated bundles against the committed
      # Node-generated ones under webmcp/examples/.
      - name: webmcp runtime embed in sync
        run: |
          go generate ./webmcp/...
          if [ -n "$(git -C .. status --porcelain -- webmcp go/webmcp)" ]; then
            echo "Embedded webmcp runtime is out of sync with webmcp/src/runtime/runtime.js."
            echo "Run 'go generate ./webmcp/...' from go/ and commit the result."
            git -C .. status --porcelain -- webmcp go/webmcp
            exit 1
          fi

      - run: go build ./...

      - run: go test ./...
