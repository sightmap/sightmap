name: changesets

# Accumulate changesets landed on main into a "Version Packages" PR. Merging that
# PR is the version bump: it bumps go/npm/package.json, writes go/npm/CHANGELOG.md,
# and syncs the plugin manifest versions (scripts/sync-manifest-versions.mjs).
#
# This workflow deliberately does NOT publish or tag. Cutting a release is a
# manual `git tag vX.Y.Z && git push origin vX.Y.Z`, which triggers the
# tag-driven release.yml (goreleaser + npm publish). A tag pushed by a workflow
# using GITHUB_TOKEN would not start a new workflow run, so the tag stays a human
# step (see .changeset/README.md).

on:
  push:
    branches: [main]

permissions:
  contents: write # let the changesets action open/update the Version Packages PR
  pull-requests: write

concurrency: changesets-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Opens/updates the "Version Packages" PR when changesets are pending.
      # No `publish:` input — releasing is a manual tag push (see above).
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
