name: docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'spec/v1/**', '.github/workflows/docs.yml', '.github/lychee.toml']
  pull_request:
    paths: ['docs/**', 'spec/v1/**', '.github/workflows/docs.yml', '.github/lychee.toml']

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      # The Schema reference page is generated from spec/v1/schema.md at build
      # time (docs/scripts/sync-spec.mjs, wired into prebuild).
      - name: Install
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: docs
        run: pnpm build

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .github/lychee.toml --base https://docs.sightmap.org --no-progress 'docs/dist/**/*.html'
          fail: true
