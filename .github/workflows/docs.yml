name: docs

# go/npm/CHANGELOG.md is in the path filter so the changelog-coverage check
# below runs on the "Version Packages" PR, which touches no docs/ files but is
# exactly where a release without an entry would slip through.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'spec/v1/**', 'go/npm/CHANGELOG.md', 'scripts/changelog-entry.mjs', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'spec/v1/**', 'go/npm/CHANGELOG.md', 'scripts/changelog-entry.mjs', '.github/workflows/docs.yml']

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: schema sync + validate + link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # reference/schema.md is generated from the canonical spec/v1/schema.md
      # and checked in (Mintlify has no build step). Fail when it drifts.
      - name: Schema page in sync
        run: |
          node docs/scripts/sync-spec.mjs
          if ! git diff --exit-code docs/reference/schema.md; then
            echo "::error::docs/reference/schema.md is out of sync with spec/v1/schema.md."
            echo "Run 'npm run sync-docs' (or 'node docs/scripts/sync-spec.mjs') and commit docs/reference/schema.md."
            exit 1
          fi

      # changelog.mdx is assembled from changelog/entries/ and checked in for
      # the same reason. Fail when it drifts.
      - name: Changelog page in sync
        run: |
          node docs/scripts/build-changelog.mjs
          git diff --exit-code docs/changelog.mdx

      # The drift check above only proves the page matches the entries — it
      # passes just fine when a release has no entry at all, which is how the
      # docs site fell a version behind npm. This asserts coverage instead:
      # every released version in go/npm/CHANGELOG.md has an entry.
      - name: Every release has a changelog entry
        run: node scripts/changelog-entry.mjs --check

      - name: Install Mintlify CLI
        run: npm i -g mint

      - name: Validate
        working-directory: docs
        run: mint validate

      - name: Link check
        working-directory: docs
        run: mint broken-links
