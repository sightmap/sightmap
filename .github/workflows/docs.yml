name: docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'spec/v1/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'spec/v1/**', '.github/workflows/docs.yml']

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: schema sync + validate + link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # reference/schema.md is generated from the canonical spec/v1/schema.md
      # and checked in (Mintlify has no build step). Fail when it drifts.
      - name: Schema page in sync
        run: |
          node docs/scripts/sync-spec.mjs
          git diff --exit-code docs/reference/schema.md

      # changelog.mdx is assembled from changelog/entries/ and checked in for
      # the same reason. Fail when it drifts.
      - name: Changelog page in sync
        run: |
          node docs/scripts/build-changelog.mjs
          git diff --exit-code docs/changelog.mdx

      - name: Install Mintlify CLI
        run: npm i -g mint

      - name: Validate
        working-directory: docs
        run: mint validate

      - name: Link check
        working-directory: docs
        run: mint broken-links
