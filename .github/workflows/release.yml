name: release

# Push a semver tag (e.g. v0.13.1) to cut a release:
#   1. goreleaser builds cross-platform binaries (config: go/.goreleaser.yml),
#      publishes a GitHub release on sightmap/sightmap, and its archives are
#      handed to the npm job as a workflow artifact.
#   2. those archives are repackaged into npm packages and published:
#        - one @sightmap/sightmap-<os>-<arch> package per platform (the binary,
#          gated by os/cpu), and
#        - the @sightmap/sightmap meta package, which lists them as
#          optionalDependencies so npm installs only the matching one (no
#          post-install download, no install scripts).
#
# npm auth uses OIDC "trusted publishing" — there is NO NPM_TOKEN secret.
# One-time setup on npmjs.com: register a Trusted Publisher (GitHub Actions,
# repository "sightmap/sightmap", workflow "release.yml") on EACH published
# package — the meta package AND all six @sightmap/sightmap-<os>-<arch>
# packages. The repo must be public (npm rejects provenance from a private
# source repo with E422). GITHUB_TOKEN is provided automatically.
#
# NOTE: npm is already at 0.13.0. The pushed tag MUST be greater than the latest
# published version and must not reuse any existing version, or `latest` moves
# backward / the publish fails.

on:
  push:
    tags:
      - 'v*'

# Least privilege by default; each job widens only what it needs.
permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload the binary assets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.2'
          cache-dependency-path: go/go.sum

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
          workdir: go
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Hand the built archives to the npm job (avoids re-downloading the release
      # we just cut, and keeps the two jobs' privileges separate).
      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: dist-archives
          path: |
            go/dist/*.tar.gz
            go/dist/*.zip
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the OIDC token npm uses for trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          name: dist-archives
          path: dist-archives

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm >= 11.5.1; ensure a new enough CLI
      # regardless of what the Node image bundles.
      - name: Update npm
        run: npm install -g npm@latest

      # Build the per-platform packages + version-synced meta from the archives.
      - name: Assemble npm packages
        run: node go/npm/scripts/build-npm-packages.mjs --version "${GITHUB_REF_NAME#v}" --dist dist-archives --out npm-staging

      # Publish platform packages first, then the meta (so its optional deps
      # already exist). No NODE_AUTH_TOKEN: npm exchanges the OIDC token via each
      # package's configured trusted publisher; provenance is attached.
      - name: Publish platform packages
        run: |
          for dir in npm-staging/@sightmap/*/; do
            echo "publishing $dir"
            ( cd "$dir" && npm publish )
          done
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Publish meta package
        run: cd npm-staging/meta && npm publish
        env:
          NPM_CONFIG_PROVENANCE: true
