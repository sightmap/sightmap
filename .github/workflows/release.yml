name: release

# Three jobs, one workflow, on every push to main:
#
#   1. version: while changesets are pending, changesets/action opens/updates
#      a "Version Packages" PR that bumps go/npm/package.json, writes
#      go/npm/CHANGELOG.md, and syncs the plugin manifest versions
#      (scripts/sync-manifest-versions.mjs). Nothing is tagged or published
#      yet. Once that PR merges (no changesets left), this job also tags the
#      release and pushes the tag.
#
#   2. goreleaser: builds cross-platform binaries (config: go/.goreleaser.yml)
#      and publishes a GitHub release on sightmap/sightmap; its archives are
#      handed to the npm job as a workflow artifact.
#
#   3. publish-npm: repackages those archives into npm packages and publishes:
#        - one @sightmap/sightmap-<os>-<arch> package per platform (the binary,
#          gated by os/cpu), and
#        - the @sightmap/sightmap meta package, which lists them as
#          optionalDependencies so npm installs only the matching one (no
#          post-install download, no install scripts).
#      npm auth uses OIDC trusted publishing; no NPM_TOKEN secret.
#
# A tag pushed by a workflow's own GITHUB_TOKEN doesn't trigger another
# workflow, so jobs 2 and 3 never rely on the tag push (job 1) to start them;
# they're gated on job 1's output instead of a `push: tags` trigger. They
# no-op if the current go/npm/package.json version is already tagged, so
# ordinary pushes to main (docs-only merges, etc.) are harmless.
#
# One-time npm setup: register a Trusted Publisher (GitHub Actions, repository
# "sightmap/sightmap", workflow "release.yml") on each published package: the
# meta package and all six @sightmap/sightmap-<os>-<arch> packages. The repo
# must be public (npm rejects provenance from a private source repo with E422).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Least privilege by default; each job widens only what it needs.
permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the Version Packages PR branch + the release tag
      pull-requests: write
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Version Packages PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for unreleased version
        id: check
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          VERSION=$(node -p "require('./go/npm/package.json').version")
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already tagged, nothing to release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag release
        if: steps.check.outputs.should_release == 'true'
        run: |
          git tag "v${{ steps.check.outputs.version }}"
          git push origin "v${{ steps.check.outputs.version }}"

  goreleaser:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload the binary assets
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.2'
          cache-dependency-path: go/go.sum

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
          workdir: go
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Hand the built archives to the npm job (avoids re-downloading the release
      # we just cut, and keeps the two jobs' privileges separate).
      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: dist-archives
          path: |
            go/dist/*.tar.gz
            go/dist/*.zip
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    needs: [version, goreleaser]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the OIDC token npm uses for trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          name: dist-archives
          path: dist-archives

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm >= 11.5.1; ensure a new enough CLI
      # regardless of what the Node image bundles.
      - name: Update npm
        run: npm install -g npm@latest

      # Build the per-platform packages + version-synced meta from the archives.
      - name: Assemble npm packages
        run: node go/npm/scripts/build-npm-packages.mjs --version "${{ needs.version.outputs.version }}" --dist dist-archives --out npm-staging

      # Publish platform packages first, then the meta (so its optional deps
      # already exist). No NODE_AUTH_TOKEN: npm exchanges the OIDC token via each
      # package's configured trusted publisher; provenance is attached.
      - name: Publish platform packages
        run: |
          for dir in npm-staging/@sightmap/*/; do
            echo "publishing $dir"
            ( cd "$dir" && npm publish )
          done
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Publish meta package
        run: cd npm-staging/meta && npm publish
        env:
          NPM_CONFIG_PROVENANCE: true
