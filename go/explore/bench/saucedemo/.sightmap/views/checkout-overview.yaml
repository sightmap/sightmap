version: 1
views:
  - name: CheckoutOverview
    route: "/checkout-step-two.html"
    url: https://www.saucedemo.com/checkout-step-two.html
    description: >
      Order review — line items (global CartItem, no RemoveButton here),
      totals, Cancel/Finish. SubtotalLabel/TaxLabel/TotalLabel are modeled
      for coverage but not readable — see their memory notes.
    components:
      - name: SubtotalLabel
        selector: '[data-test="subtotal-label"]'
      - name: TaxLabel
        selector: '[data-test="tax-label"]'
      - name: TotalLabel
        selector: '[data-test="total-label"]'
      - name: FinishButton
        selector: '[data-test="finish"]'
