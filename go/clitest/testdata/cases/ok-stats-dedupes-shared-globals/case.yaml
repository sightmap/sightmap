title: "Guard: stats dedupes a $ref-reused global in the totals while per-view rows keep their expanded copies"
known_bug: false
run:
  args: [stats]
  fixture: fixture
expect:
  exit: zero
  output:
    - must_match: 'Components\s+6'
      why: >
        Navigation is defined globally and $ref-reused by both views (3
        occurrences after expansion) but is ONE distinct component; the total
        must be 6 (Navigation, Footer, CartSummary, PaymentForm, submit,
        ActivityFeed), not 8.
    - must_match: 'Checkout\s+/checkout\s+4\s+1'
      why: per-view rows count components reachable after $ref expansion (Navigation + CartSummary + PaymentForm + submit) and view-scoped requests
    - must_match: 'Dashboard\s+/dashboard\s+2\s+0'
      why: the second view's row includes its own expanded copy of the shared global
    - must_match: 'Requests\s+2'
      why: global (view-less) requests are included in the totals alongside view-scoped ones
    - must_match: 'Memory\s+2'
      why: the shared global's memory entry counts once corpus-wide, not once per expanded copy
    - must_not_match: 'Components\s+8'
      why: counting every expanded occurrence instead of distinct names is the dedupe bug this case pins
