version: 1

views:
  - name: Checkout
    route: /checkout
    components:
      - $ref: Navigation
      - name: CartSummary
        selector: '[data-component="CartSummary"]'
      - name: PaymentForm
        selector: '[data-component="PaymentForm"]'
        memory:
          - Submit is disabled until required fields validate
        children:
          - name: submit
            selector: 'button[type="submit"]'
    requests:
      - name: PlaceOrder
        route: /api/orders
        method: POST
