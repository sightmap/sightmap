title: "Guard: bare `sightmap add` names the missing SLUG and prints usage instead of reaching for the network"
known_bug: false
run:
  args: [add]
expect:
  exit: nonzero
  output:
    - must_match: 'expected a SLUG argument'
      why: >
        `add` is the one verb an agent reaches for with no arguments — it is
        the command a gallery page told it to run. The refusal has to name the
        argument that is missing, not just dump flags.
    - must_match: 'Usage: sightmap add SLUG \[--index URL\] \[--target DIR\] \[--force\]'
      why: >
        The usage line is where the agent learns the whole surface in one
        read, so it must stay in sync with the flags the binary accepts.
    - must_not_match: 'GET https?://'
      why: >
        Argument errors are decided before any network I/O. A fetch failure
        against the default index would blame the atlas (or the user's
        connectivity) for what is a missing argument.
