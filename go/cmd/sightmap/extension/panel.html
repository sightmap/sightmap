<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Sightmap</title>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: "Menlo", "Monaco", "Consolas", monospace;
                font-size: 11px;
                line-height: 1.5;
                background: #1e1e1e;
                color: #d4d4d4;
                display: flex;
                flex-direction: column;
                height: 100vh;
                overflow: hidden;
            }

            /* ── Toolbar ──────────────────────────────────────────────────────── */
            #toolbar {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 4px 8px;
                background: #252526;
                border-bottom: 1px solid #3c3c3c;
                flex-shrink: 0;
            }
            #toolbar h1 {
                font-size: 11px;
                font-weight: 600;
                color: #9cdcfe;
                letter-spacing: 0.05em;
                flex: 1;
            }
            #status-badge {
                font-size: 10px;
                padding: 1px 6px;
                border-radius: 10px;
                background: #3c3c3c;
                color: #888;
            }
            #status-badge.connected {
                background: #1e3a1e;
                color: #4caf50;
            }
            button {
                font-family: inherit;
                font-size: 10px;
                padding: 2px 8px;
                border-radius: 3px;
                border: 1px solid #555;
                background: #2d2d2d;
                color: #ccc;
                cursor: pointer;
            }
            button:hover {
                background: #3a3a3a;
            }

            /* ── Current hover path ───────────────────────────────────────────── */
            #hover-section {
                padding: 6px 8px;
                background: #252526;
                border-bottom: 1px solid #3c3c3c;
                flex-shrink: 0;
                min-height: 36px;
            }
            #hover-label {
                font-size: 10px;
                color: #666;
                margin-bottom: 2px;
            }
            #hover-path {
                color: #9cdcfe;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            #hover-path:empty::before {
                content: "—";
                color: #555;
            }

            /* ── Event log ────────────────────────────────────────────────────── */
            #log-section {
                flex: 1;
                overflow-y: auto;
                padding: 4px 0;
            }
            #log-section:empty::before {
                content: "Interact with the page to see structured events…";
                display: block;
                color: #555;
                padding: 12px 8px;
                font-style: italic;
            }

            .event-row {
                display: grid;
                grid-template-columns: 62px 36px 1fr;
                gap: 4px;
                padding: 3px 8px;
                border-bottom: 1px solid #2a2a2a;
                cursor: pointer;
                transition: background 0.1s;
            }
            .event-row:hover {
                background: #2a2a2a;
            }
            .event-row.expanded {
                background: #252526;
            }

            .event-time {
                color: #666;
            }
            .event-type {
                text-align: center;
                border-radius: 3px;
                padding: 0 3px;
                font-size: 10px;
                font-weight: 600;
            }
            .event-type.click {
                background: #1a3a5c;
                color: #4fc3f7;
            }
            .event-type.input {
                background: #1a3a1a;
                color: #81c784;
            }
            .event-type.change {
                background: #3a2a1a;
                color: #ffb74d;
            }
            .event-type.focus {
                background: #2a1a3a;
                color: #ce93d8;
            }

            .event-path {
                color: #d4d4d4;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .event-path .comp {
                color: #9cdcfe;
            }
            .event-path .prop {
                color: #ce9178;
            }
            .event-path .orphan {
                color: #f44336;
            }

            .event-detail {
                display: none;
                grid-column: 1 / -1;
                padding: 4px 8px 6px;
                background: #1a1a1a;
                color: #888;
                white-space: pre-wrap;
                font-size: 10px;
                border-top: 1px solid #2a2a2a;
            }
            .event-row.expanded .event-detail {
                display: block;
            }
        </style>
    </head>
    <body>
        <div id="toolbar">
            <h1>⬡ Sightmap</h1>
            <span id="status-badge">not connected</span>
            <button id="btn-clear">Clear</button>
            <button id="btn-pause">Pause</button>
        </div>

        <div id="hover-section">
            <div id="hover-label">Hovering:</div>
            <div id="hover-path"></div>
        </div>

        <div id="log-section" id="log"></div>

        <script src="panel.js"></script>
    </body>
</html>
