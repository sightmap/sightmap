version: 1
views:
  # Placeholder routes (native screens have no URL); see login.yaml.
  - name: Products
    route: /products
    components:
      - name: ProductRow
        selector: '[identifier^="product-row-"]'
        properties:
          - name: title
            extract: { from: dom.text }
  - name: ProductDetail
    route: /products/detail
    components:
      - name: ProductName
        selector: '[identifier="product-detail-name"]'
      - name: AddToCartButton
        selector: 'button[identifier="product-detail-add"]'
      - name: OfferButton
        selector: 'button[identifier="product-detail-offer"]'
  - name: Offer
    route: /products/offer
    components:
      - name: OfferTitle
        selector: '[identifier="offer-title"]'
      - name: ClaimOfferButton
        selector: 'button[identifier="offer-claim"]'
      - name: CloseOfferButton
        selector: 'button[identifier="offer-close"]'
