version: 1
views:
  - name: Results
    route: /search
    components:
      - name: ProductCard
        selector: '[data-testid="product-pod"]'
        properties:
          - name: price
            extract: Price.text
          - name: sold_out
            extract: exists:SoldOutBadge
          - name: label
            extract: text
        children:
          - name: Price
            selector: '[data-testid="price"]'
            properties:
              - name: text
                extract: text
          - name: SoldOutBadge
            selector: '[aria-label="Sold Out"]'
