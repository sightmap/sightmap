version: 1
views:
  - name: Results
    route: /search
    components:
      - name: ProductCard
        selector: '[data-testid="product-pod"]'
        properties:
          - name: price
            extract: { from: component, path: Price.text }
          - name: sold_out
            extract: { from: component.exists, path: SoldOutBadge }
          - name: label
            extract: { from: dom.text }
        children:
          - name: Price
            selector: '[data-testid="price"]'
            properties:
              - name: text
                extract: { from: dom.text }
          - name: SoldOutBadge
            selector: '[aria-label="Sold Out"]'
