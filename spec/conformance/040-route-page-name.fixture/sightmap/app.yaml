version: 1
views:
  # Native apps report a page name (no leading slash) in place of a URL. It is
  # rooted and compared case-insensitively; a URL path stays case-sensitive.
  - name: Shop
    route: /shop
  - name: Product
    route: /*ProductViewController
  # Characters that would change how a URL parses are ordinary in a page name.
  - name: ShopCart
    route: /shop:cart
  - name: Discount
    route: /50% off
  - name: Cart
    route: /shopping cart
