version: 1
requests:
  - name: CheckoutPayment
    route: /api/checkout/pay
    method: POST
    properties:
      - name: status
        field: rsp.body.status
  - name: CheckoutRetryPayment
    route: /api/checkout/pay/retry
    method: POST
    properties:
      - name: rate_limit_remaining
        pattern: 'X-RateLimit-Remaining:\s*(\d+)'
