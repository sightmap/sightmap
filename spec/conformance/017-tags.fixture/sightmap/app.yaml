version: 1
components:
  - name: CheckoutForm
    selector: '.checkout-form'
    tags: [defect, ui-risk]
    children:
      - name: SubmitButton
        selector: 'button[type="submit"]'
      - name: ErrorBanner
        selector: '.error-banner'
        tags: [defect]
  - name: NavFooter
    selector: '#footer'

requests:
  - name: SubmitPayment
    route: /api/checkout/payment
    method: POST
    tags: [defect]
  - name: TrackEvent
    route: /api/analytics/track
    method: POST

views:
  - name: Checkout
    route: /checkout/**
    tags: [defect]
  - name: CheckoutPayment
    route: /checkout/payment

messages:
  - name: CartVersionMismatch
    level: ERROR
    message: cart version mismatch
    tags: [defect, checkout]
  # Untagged, to prove omission stays clean.
  - name: SlowNetworkWarning
    level: WARN
    message: 'request .* took over \d+ms'

signals:
  # A signal's own tag, unioned with the tags of the component it references:
  # CheckoutForm carries [defect, ui-risk], so this resolves to
  # [defect, state-risk, ui-risk].
  - name: checkout.form.present
    ref: CheckoutForm
    tags: [state-risk]
  # No tags of its own: it still inherits the referenced view's.
  - name: checkout.active
    ref: Checkout
