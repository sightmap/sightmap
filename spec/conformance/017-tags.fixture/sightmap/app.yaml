version: 1
components:
  - name: CheckoutForm
    selector: '.checkout-form'
    tags: [defect, ui-risk]
    children:
      - name: SubmitButton
        selector: 'button[type="submit"]'
      - name: ErrorBanner
        selector: '.error-banner'
        tags: [defect]
  - name: NavFooter
    selector: '#footer'

requests:
  - name: SubmitPayment
    route: /api/checkout/payment
    method: POST
    tags: [defect]
  - name: TrackEvent
    route: /api/analytics/track
    method: POST

views:
  - name: Checkout
    route: /checkout/**
    tags: [defect]
  - name: CheckoutPayment
    route: /checkout/payment
